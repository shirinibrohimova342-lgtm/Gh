bel for=\"L\">Induktivlik L\u003c/label>\u003cinput id=\"L\" type=\"range\" min=\"0.01\" max=\"1\" step=\"0.01\" value=\"0.1\">\u003coutput id=\"Lo\">\u003c/output>\u003c/div>\n\u003cdiv class=\"ctl\">\u003clabel for=\"f\">Chastota f\u003c/label>\u003cinput id=\"f\" type=\"range\" min=\"0\" max=\"500\" step=\"1\" value=\"50\">\u003coutput id=\"fo\">\u003c/output>\u003c/div>\n\u003cdiv class=\"ctl\">\u003clabel for=\"Um\">Amplituda U\u003csub>m\u003c/sub>\u003c/label>\u003cinput id=\"Um\" type=\"range\" min=\"10\" max=\"310\" step=\"1\" value=\"310\">\u003coutput id=\"Uo\">\u003c/output>\u003c/div>\n\u003cdiv class=\"row\">\u003cbutton class=\"btn\" id=\"play\">Pauza\u003c/button>\u003cbutton class=\"btn\" id=\"speed\">Tezlik: 1×\u003c/button>\u003c/div>\n\u003cdiv class=\"stats\">\n\u003cdiv class=\"stat\">\u003csmall>Induktiv qarshilik\u003c/small>\u003cspan class=\"num\">X\u003csub>L\u003c/sub> = \u003cspan id=\"xl\">\u003c/span>\u003c/span>\u003c/div>\n\u003cdiv class=\"stat\">\u003csmall>Tok amplitudasi\u003c/small>\u003cspan class=\"num i\">I\u003csub>m\u003c/sub> = \u003cspan id=\"im\">\u003c/span>\u003c/span>\u003c/div>\n\u003cdiv class=\"stat\">\u003csmall>Magnit maydon energiyasi\u003c/small>\u003cspan class=\"num p\">W = \u003cspan id=\"w\">\u003c/span>\u003c/span>\u003c/div>\n\u003cdiv class=\"stat\">\u003csmall>O‘rtacha quvvat\u003c/small>\u003cspan class=\"num\">P = 0 Vt\u003c/span>\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003cdiv class=\"grid\">\n\u003cdiv class=\"card\">\u003ch3 style=\"margin:0 0 6px\">Tok va kuchlanish grafigi\u003c/h3>\u003ccanvas id=\"cw\" width=\"600\" height=\"300\">\u003c/canvas>\n\u003cp class=\"note\">\u003cb class=\"i\">i(t)\u003c/b> qizil, \u003cb class=\"u\">u(t)\u003c/b> ko‘k. Tok kuchlanishdan \u003cb>π/2 (90°)\u003c/b> orqada qoladi. Grafiklar o‘z amplitudasiga normallangan.\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3 style=\"margin:0 0 6px\">Vektor diagramma\u003c/h3>\u003ccanvas id=\"cp\" width=\"600\" height=\"300\">\u003c/canvas>\n\u003cp class=\"note\">Vektorlar soat strelkasiga teskari aylanadi. Vertikal o‘qdagi proyeksiya — oniy qiymat.\u003c/p>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"card\">\u003ch3 style=\"margin:0 0 6px\">Quvvat p(t) = u·i va energiya\u003c/h3>\u003ccanvas id=\"cq\" width=\"1000\" height=\"200\">\u003c/canvas>\n\u003cp class=\"note\">\u003cspan class=\"p\">Yashil\u003c/span> egri chiziq: musbat yarim to‘lqinda g‘altak energiyani magnit maydonga yig‘adi, manfiyida manbaga qaytaradi. Shuning uchun o‘rtacha quvvat nolga teng (reaktiv quvvat). Pastdagi chiziq — magnit maydon energiyasi W = LI²/2 ning o‘zgarishi.\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003cdiv class=\"formula\">X\u003csub>L\u003c/sub> = ωL = 2πfL &nbsp;|&nbsp; I\u003csub>m\u003c/sub> = U\u003csub>m\u003c/sub>/X\u003csub>L\u003c/sub> &nbsp;|&nbsp; W = LI²/2\u003c/div>\n\u003cp class=\"note\">f ni 0 ga tushiring: X\u003csub>L\u003c/sub> = 0, g‘altak o‘zgarmas tokda oddiy sim kabi (ideal holda) qarshilik ko‘rsatmaydi.\u003c/p>\u003c/div>\n\u003c/section>\n\n\u003csection id=\"lamp\">\n\u003cdiv class=\"card\">\n\u003cp>Lampochka va g‘altak ketma-ket ulangan (R\u003csub>lampa\u003c/sub> = 50 Ω, L = 0,1 Gn, f = 50 Hz, o‘zak kiritilsa L taxminan 10 marta ortadi).\u003c/p>\n\u003cdiv class=\"row\">\u003cbutton class=\"btn on\" id=\"bDC\">O‘zgarmas tok\u003c/button>\u003cbutton class=\"btn\" id=\"bAC\">O‘zgaruvchan tok\u003c/button>\u003cbutton class=\"btn\" id=\"bCore\">Temir o‘zak: yo‘q\u003c/button>\u003c/div>\n\u003ccanvas id=\"cl\" width=\"800\" height=\"280\">\u003c/canvas>\n\u003cdiv class=\"stats\">\n\u003cdiv class=\"stat\">\u003csmall>Zanjir qarshiligi\u003c/small>\u003cspan class=\"num\" id=\"lz\">\u003c/span>\u003c/div>\n\u003cdiv class=\"stat\">\u003csmall>Lampa yorqinligi\u003c/small>\u003cspan class=\"num\" id=\"lb\">\u003c/span>\u003c/div>\n\u003c/div>\n\u003cp class=\"note\" id=\"lexp\">\u003c/p>\n\u003c/div>\n\u003c/section>\n\n\u003csection id=\"test\">\n\u003cdiv class=\"card\">\n\u003cdiv class=\"bar\">\u003ci id=\"tb\">\u003c/i>\u003c/div>\n\u003cp class=\"note\" id=\"tc\">\u003c/p>\n\u003cdiv id=\"tq\">\u003c/div>\n\u003cdiv class=\"row\">\u003cbutton class=\"btn\" id=\"tn\" style=\"display:none\">Keyingi savol\u003c/button>\u003cbutton class=\"btn\" id=\"tr\" style=\"display:none\">Qayta boshlash\u003c/button>\u003c/div>\n\u003c/div>\n\u003c/section>\n\n\u003csection id=\"plan\">\n\u003cdiv class=\"card\">\u003ch2>3 ta dars rejasi\u003c/h2>\n\u003ctable>\u003ctr>\u003cth>Reja\u003c/th>\u003cth>Asosiy mazmun\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>1.\u003c/b> O‘zinduksiya\u003c/td>\u003ctd>G‘altak tuzilishi, ε = −L·ΔI/Δt, L = μ₀μN²S/l, birligi 1 Gn. Tajriba: lampa + g‘altak.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>2.\u003c/b> Induktiv qarshilik\u003c/td>\u003ctd>X\u003csub>L\u003c/sub> = 2πfL, I = U/X\u003csub>L\u003c/sub>. Misol: L = 0,1 Gn, f = 50 Hz → 31,4 Ω. Drossel, filtr, transformator.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>3.\u003c/b> Faza va quvvat\u003c/td>\u003ctd>Tok kuchlanishdan 90° orqada, P = 0 (reaktiv quvvat), W = LI²/2.\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cdiv class=\"card\">\u003ch2>Metod: «Klaster» + muammoli savol (45 daq)\u003c/h2>\n\u003ctable>\u003ctr>\u003cth>Daqiqa\u003c/th>\u003cth>Bosqich\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Muammo: nega g‘altak bilan lampa xira yonadi?\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>7\u003c/td>\u003ctd>Tajriba (Lampa tajribasi bo‘limi)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>10\u003c/td>\u003ctd>Klaster: markazda «Induktiv g‘altak», tarmoqlar: L, X\u003csub>L\u003c/sub>, faza, quvvat, qo‘llanilishi\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>10\u003c/td>\u003ctd>Yangi bilim: formulalar (Simulyator bo‘limi)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>8\u003c/td>\u003ctd>Guruhlarda 2 ta masala\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Test va baholash\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003c/section>\n\u003c/main>\n\n\u003cscript>\nconst $=id=>document.getElementById(id);\nconst css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();\n// Tabs\ndocument.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{\n document.querySelectorAll('#tabs button').forEach(x=>x.setAttribute('aria-selected',x===b));\n document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id===b.dataset.t));\n});\n// Simulyator\nlet playing=true,spd=1,T=0,last=performance.now();\nconst fmt=(v,d=1)=>Number(v).toLocaleString('uz-UZ',{maximumFractionDigits:d});\nfunction vals(){const L=+$('L').value,f=+$('f').value,Um=+$('Um').value;\n const XL=2*Math.PI*f*L;const Im=f===0?Infinity:Um/XL;return{L,f,Um,XL,Im}}\nfunction upd(){const v=vals();$('Lo').textContent=fmt(v.L,2)+' Gn';$('fo').textContent=v.f+' Hz';$('Uo').textContent=v.Um+' V';\n $('xl').textContent=fmt(v.XL)+' Ω';\n $('im').textContent=v.f===0?'∞ (ideal)':fmt(v.Im,2)+' A';\n $('w').textContent=v.f===0?'—':fmt(v.L*v.Im*v.Im/2,2)+' J'}\n['L','f','Um'].forEach(i=>$(i).oninput=upd);upd();\n$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'Pauza':'Davom etish'};\n$('speed').onclick=()=>{spd=spd>=4?0.25:spd*2;$('speed').textContent='Tezlik: '+spd+'×'};\nfunction ax(c,w,h,mid){c.strokeStyle=css('--bd');c.lineWidth=1;c.beginPath();c.moveTo(0,mid);c.lineTo(w,mid);c.stroke()}\nfunction drawW(){const cv=$('cw'),c=cv.getContext('2d'),w=cv.width,h=cv.height,m=h/2,A=h*0.38;\n c.clearRect(0,0,w,h);ax(c,w,h,m);\n const th=T%(4*Math.PI),x0=(th/(4*Math.PI))*w;\n [['--u',t=>Math.sin(t+Math.PI/2)],['--i',t=>Math.sin(t)]].forEach(([col,fn])=>{\n  c.strokeStyle=css(col);c.lineWidth=2.5;c.beginPath();\n  for(let x=0;x\u003c=w;x++){const t=x/w*4*Math.PI,y=m-A*fn(t);x?c.lineTo(x,y):c.moveTo(x,y)}c.stroke();\n  c.fillStyle=css(col);c.beginPath();c.arc(x0,m-A*fn(th),6,0,7);c.fill()});\n c.strokeStyle=css('--mu');c.setLineDash([4,4]);c.beginPath();c.moveTo(x0,8);c.lineTo(x0,h-8);c.stroke();c.setLineDash([]);\n c.fillStyle=css('--mu');c.font='13px system-ui';c.fillText('0',4,m-4);c.fillText('2π',w/2-8,m-4);c.fillText('t →',w-34,m+16);\n // phase gap marker\n c.fillStyle=css('--tx');c.fillText('Δφ = π/2',w*0.02+60,18)}\nfunction drawP(){const cv=$('cp'),c=cv.getContext('2d'),w=cv.width,h=cv.height,cx=w*0.5,cy=h*0.5,R=h*0.38;\n c.clearRect(0,0,w,h);c.strokeStyle=css('--bd');c.beginPath();c.moveTo(0,cy);c.lineTo(w,cy);c.moveTo(cx,0);c.lineTo(cx,h);c.stroke();\n c.beginPath();c.arc(cx,cy,R,0,7);c.stroke();\n const th=T;\n function vec(a,col,lab){const x=cx+R*Math.cos(a),y=cy-R*Math.sin(a);\n  c.strokeStyle=c.fillStyle=css(col);c.lineWidth=3;c.beginPath();c.moveTo(cx,cy);c.lineTo(x,y);c.stroke();\n  c.beginPath();c.arc(x,y,5,0,7);c.fill();c.font='bold 14px system-ui';c.fillText(lab,x+8,y-6);\n  c.lineWidth=1;c.setLineDash([3,4]);c.beginPath();c.moveTo(x,y);c.lineTo(cx+R+30,y);c.stroke();c.setLineDash([]);\n  c.beginPath();c.arc(cx+R+30,y,4,0,7);c.fill()}\n vec(th+Math.PI/2,'--u','U');vec(th,'--i','I');\n c.strokeStyle=css('--tx');c.lineWidth=1.5;c.beginPath();c.arc(cx,cy,28,th,th+Math.PI/2);c.stroke();\n c.fillStyle=css('--tx');c.font='13px system-ui';c.fillText('90°',cx+34*Math.cos(th+Math.PI/4),cy-34*Math.sin(th+Math.PI/4))}\nfunction drawQ(){const cv=$('cq'),c=cv.getContext('2d'),w=cv.width,h=cv.height,m=h*0.38,A=h*0.3;\n c.clearRect(0,0,w,h);ax(c,w,h,m);\n const th=T%(4*Math.PI),x0=th/(4*Math.PI)*w;\n // p = sin(t)*cos(t)=sin(2t)/2 ; normalized\n c.strokeStyle=css('--p');c.lineWidth=2.5;c.beginPath();\n for(let x=0;x\u003c=w;x++){const t=x/w*4*Math.PI,y=m-A*Math.sin(2*t);x?c.lineTo(x,y):c.moveTo(x,y)}c.stroke();\n c.strokeStyle=css('--i');c.lineWidth=2;c.beginPath();\n const b=h-12;for(let x=0;x\u003c=w;x++){const t=x/w*4*Math.PI,y=b-(h*0.22)*Math.sin(t)**2;x?c.lineTo(x,y):c.moveTo(x,y)}c.stroke();\n c.strokeStyle=css('--mu');c.setLineDash([4,4]);c.beginPath();c.moveTo(x0,4);c.lineTo(x0,h-4);c.stroke();c.setLineDash([]);\n const s=Math.sin(2*th);c.fillStyle=s>0?css('--p'):css('--i');c.font='bold 13px system-ui';\n c.fillText(s>0?'p > 0: energiya g‘altakka yig‘ilmoqda':'p \u003c 0: energiya manbaga qaytmoqda',10,16);\n c.fillStyle=css('--i');c.fillText('W(t) ~ i²',10,h-24)}\n// Lampa\nlet mode='DC',core=false;\nfunction setL(){$('bDC').classList.toggle('on',mode==='DC');$('bAC').classList.toggle('on',mode==='AC');\n $('bCore').classList.toggle('on',core);$('bCore').textContent='Temir o‘zak: '+(core?'bor':'yo‘q')}\n$('bDC').onclick=()=>{mode='DC';setL()};$('bAC').onclick=()=>{mode='AC';setL()};$('bCore').onclick=()=>{core=!core;setL()};\nfunction lampB(){const R=50,L=core?1:0.1,XL=mode==='DC'?0:2*Math.PI*50*L,Z=Math.hypot(R,XL);return{Z,XL,b:R/Z}}\nfunction drawL(){const cv=$('cl'),c=cv.getContext('2d'),w=cv.width,h=cv.height;c.clearRect(0,0,w,h);\n const o=lampB();\n // wire\n c.strokeStyle=css('--tx');c.lineWidth=3;c.beginPath();c.moveTo(130,60);c.lineTo(40,60);c.lineTo(40,230);c.lineTo(760,230);c.lineTo(760,60);c.lineTo(670,60);c.stroke();\n c.beginPath();c.moveTo(330,60);c.lineTo(430,60);c.stroke();\n // source\n c.fillStyle=css('--sf');c.beginPath();c.arc(40,145,24,0,7);c.fill();c.stroke();c.fillStyle=css('--tx');c.font='bold 16px system-ui';c.fillText(mode==='DC'?'=':'~',34,151);\n // coil\n const cx=130;c.lineWidth=3;\n if(core){c.fillStyle=css('--mu');c.globalAlpha=.5;c.fillRect(cx+4,48,196,24);c.globalAlpha=1}\n c.beginPath();for(let k=0;k\u003c6;k++){c.moveTo(cx+k*34,60);c.arc(cx+k*34+17,60,17,Math.PI,0)}c.stroke();\n c.font='14px system-ui';c.fillStyle=css('--tx');c.fillText('G‘altak L'+(core?' + o‘zak':''),cx+30,34);\n // lamp\n const lx=550,ly=60,r=40;c.shadowColor='#ffd54a';c.shadowBlur=60*o.b;\n c.fillStyle=`rgba(255,213,74,${0.08+0.92*o.b})`;c.beginPath();c.arc(lx,ly,r,0,7);c.fill();c.shadowBlur=0;c.strokeStyle=css('--tx');c.stroke();\n c.beginPath();c.moveTo(lx-22,ly-22);c.lineTo(lx+22,ly+22);c.moveTo(lx+22,ly-22);c.lineTo(lx-22,ly+22);c.stroke();\n c.fillStyle=css('--tx');c.fillText('Lampa 50 Ω',lx-34,ly+r+22);\n // electrons\n const dir=mode==='DC'?1:Math.sin(T*1.4);const n=26,per=1380;const sp=T*40*o.b;\n c.fillStyle=css('--u');\n for(let k=0;k\u003cn;k++){let d=((k*per/n+(mode==='DC'?sp:Math.sin(T*1.4)*60*o.b))%per+per)%per,x,y;\n  if(d\u003c720){x=40+d;y=230}else if(d\u003c890){x=760;y=230-(d-720)}else if(d\u003c1380){x=760-(d-890)*1.0;y=60}\n  if(y===60&&x\u003c130)continue;c.globalAlpha=.4+.6*o.b;c.beginPath();c.arc(Math.max(40,x),y,4,0,7);c.fill()}\n c.globalAlpha=1;\n $('lz').textContent='Z = '+fmt(o.Z)+' Ω';$('lb').textContent=fmt(o.b*100,0)+' %';\n $('lexp').textContent=mode==='DC'?'O‘zgarmas tokda X_L = 0: g‘altak faqat sim qarshiligini beradi, lampa to‘liq yorqin.':\n  core?'Temir o‘zak L ni oshiradi, X_L = 2πfL ortadi, tok kamayadi: lampa yanada xira.':'O‘zgaruvchan tokda X_L = 31,4 Ω qo‘shiladi, zanjir qarshiligi √(R² + X_L²) bo‘ladi: lampa xira.'}\nsetL();\n// Test\nconst Q=[[\"Induktiv qarshilik formulasi qaysi?\",[\"X_L = 1/ωL\",\"X_L = ωL\",\"X_L = L/ω\",\"X_L = ω/L\"],1],\n[\"Induktiv qarshilik birligi:\",[\"Genri\",\"Farad\",\"Om\",\"Vebber\"],2],\n[\"Chastota 2 marta oshsa, X_L qanday o‘zgaradi?\",[\"2 marta ortadi\",\"2 marta kamayadi\",\"o‘zgarmaydi\",\"4 marta ortadi\"],0],\n[\"Ideal g‘altakda tok kuchlanishga nisbatan:\",[\"π/2 ga oldinda\",\"π/2 ga orqada\",\"fazada mos\",\"π ga orqada\"],1],\n[\"O‘zgarmas tok zanjirida ideal g‘altakning induktiv qarshiligi:\",[\"cheksiz\",\"1 Ω\",\"nolga teng\",\"L ga teng\"],2],\n[\"Ideal g‘altakda o‘rtacha iste’mol quvvati:\",[\"maksimal\",\"U·I\",\"nolga teng\",\"U·I/2\"],2],\n[\"L = 0,1 Gn, f = 50 Hz bo‘lsa, X_L taxminan:\",[\"5 Ω\",\"15,7 Ω\",\"31,4 Ω\",\"314 Ω\"],2],\n[\"220 V kuchlanishli zanjirda X_L = 110 Ω bo‘lsa, tok kuchi:\",[\"0,5 A\",\"2 A\",\"24 A\",\"110 A\"],1],\n[\"L = 0,2 Gn, I = 3 A bo‘lsa, magnit maydon energiyasi:\",[\"0,3 J\",\"0,6 J\",\"0,9 J\",\"1,8 J\"],2],\n[\"G‘altakka temir o‘zak kiritilsa, X_L:\",[\"kamayadi\",\"ortadi\",\"o‘zgarmaydi\",\"nolga teng bo‘ladi\"],1]];\nlet qi=0,score=0,done=false;\nfunction showQ(){done=false;$('tn').style.display='none';$('tr').style.display='none';\n if(qi>=Q.length){$('tq').innerHTML='\u003ch2>Natija: '+score+' / '+Q.length+'\u003c/h2>\u003cp>'+(score>=9?'A’lo!':score>=7?'Yaxshi.':'Nazariyani simulyatorda qayta ko‘rib chiqing.')+'\u003c/p>';\n  $('tc').textContent='Test tugadi';$('tb').style.width='100%';$('tr').style.display='';return}\n const q=Q[qi];$('tc').textContent='Savol '+(qi+1)+' / '+Q.length;$('tb').style.width=(qi/Q.length*100)+'%';\n $('tq').innerHTML='\u003ch3>'+q[0]+'\u003c/h3>'+q[1].map((o,k)=>'\u003cbutton class=\"opt\" data-k=\"'+k+'\">'+'ABCD'[k]+') '+o+'\u003c/button>').join('');\n document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(done)return;done=true;const k=+b.dataset.k;\n  if(k===q[2]){score++;b.classList.add('ok')}else{b.classList.add('no');document.querySelectorAll('.opt')[q[2]].classList.add('ok')}\n  $('tn').style.display='';$('tn').textContent=qi===Q.length-1?'Natijani ko‘rish':'Keyingi savol'})}\n$('tn').onclick=()=>{qi++;showQ()};$('tr').onclick=()=>{qi=0;score=0;showQ()};showQ();\n// Loop\nfunction loop(now){const dt=Math.min(0.05,(now-last)/1000);last=now;\n if(playing){const f=+$('f').value;T+=dt*spd*(1.2+Math.min(f,500)/150)}\n if($('sim').classList.contains('on')){drawW();drawP();drawQ()}\n if($('lamp').classList.contains('on'))drawL();\n requestAnimationFrame(loop)}\nrequestAnimationFrame(loop);\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}, {"t": "1-chorak CHSB", "h": "\u003c!DOCTYPE html>\n\u003chtml lang=\"uz\">\u003chead>\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>11-sinf Fizika — 1-chorak CHSB\u003c/title>\n\u003cstyle>\n:root{--bg:#f6f7fb;--card:#fff;--tx:#1b2333;--mu:#5b667a;--ac:#1d6fd8;--bd:#c9d0df;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root{--bg:#10141c;--card:#1a2030;--tx:#e8ecf5;--mu:#9aa6bd;--ac:#5aa2ff;--bd:#2e3750}}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif}\nheader,main{max-width:900px;margin:auto;padding:0 16px}header{padding-top:18px}\nh1{font-size:1.45rem;margin:0 0 4px}h2{font-size:1.2rem;margin:14px 0 8px;color:var(--ac)}h3{font-size:1.02rem;margin:14px 0 6px}\n.sub{color:var(--mu);margin:0 0 8px}\nnav{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;display:flex;gap:6px;overflow-x:auto;padding:8px 16px;max-width:900px;margin:auto}\nnav button{flex:0 0 auto;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:20px;font:inherit;cursor:pointer}\nnav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}\nsection{display:none;padding-bottom:40px}section.on{display:block}\n.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin:12px 0}\ntable{border-collapse:collapse;width:100%;font-size:.93rem}th,td{border:1px solid var(--bd);padding:6px 8px;text-align:left;vertical-align:top}\nth{background:color-mix(in srgb,var(--ac) 14%,var(--card))}.scroll{overflow-x:auto}\n.who{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px 16px;margin:8px 0 12px}\n.who span{border-bottom:1px solid var(--tx);padding-bottom:2px;min-height:1.6em}\n.t{margin:8px 0}.t .o{margin-left:18px}.pts{color:var(--mu);font-size:.85rem;white-space:nowrap}\n.ans{border:1px dashed var(--bd);border-radius:6px;min-height:70px;margin:6px 0}\nbutton.b{border:0;background:var(--ac);color:#fff;padding:9px 14px;border-radius:8px;font:inherit;cursor:pointer;margin-right:6px}\n@media print{\n:root{--bg:#fff;--card:#fff;--tx:#000;--mu:#333;--ac:#000;--bd:#888}\nnav,header .b,.noprint,button{display:none!important}.card{border:0;padding:0}body{font-size:12.5pt}\nsection{break-after:page}.ans{break-inside:avoid}}\n\u003c/style>\u003c/head>\u003cbody>\n\u003cheader>\u003ch1>Fizika · 11-sinf · 1-chorak CHSB\u003c/h1>\n\u003cp class=\"sub\">Chorak yakuni boʻyicha summativ baholash: «Elektromagnit tebranishlar» · 2 variant · 45 daqiqa · 30 ball\u003c/p>\n\u003cp class=\"noprint\">\u003cbutton class=\"b\" onclick=\"print()\">🖨 Joriy boʻlimni chop etish / PDF\u003c/button>\u003c/p>\u003c/header>\n\u003cnav id=\"nav\">\u003c/nav>\n\u003cmain>\n\u003csection id=\"s0\" class=\"on\">\n\u003ch2>Spetsifikatsiya\u003c/h2>\n\u003cdiv class=\"card\">\u003cp>\u003cb>Qamrab olingan mavzular:\u003c/b> erkin elektromagnit tebranishlar va tebranish konturi; Tomson formulasi; konturda energiya almashinuvi; oʻzgaruvchan tok va ta’sir etuvchi qiymatlar; kondensator va gʻaltakning qarshiligi, faza siljishi; avtotebranish va tranzistorli generator; rezonans.\u003cbr>\n\u003cb>Vaqt:\u003c/b> 45 daqiqa. \u003cb>Jami ball:\u003c/b> 30. \u003cb>Variantlar:\u003c/b> 2 (mazmuni va qiyinligi teng). Kalkulyator ruxsat etiladi (π ≈ 3,14).\u003c/p>\n\u003cdiv class=\"scroll\">\u003ctable>\u003ctr>\u003cth>Topshiriq\u003c/th>\u003cth>Mazmun elementi\u003c/th>\u003cth>Turi, daraja\u003c/th>\u003cth>Ball\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1–2\u003c/td>\u003ctd>Erkin tebranishlar, Tomson formulasi\u003c/td>\u003ctd>Test, bilish\u003c/td>\u003ctd>2\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3–4\u003c/td>\u003ctd>Konturda energiya almashinuvi\u003c/td>\u003ctd>Test, tushunish\u003c/td>\u003ctd>2\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>5–8\u003c/td>\u003ctd>Oʻzgaruvchan tok, X\u003csub>C\u003c/sub>, X\u003csub>L\u003c/sub>, faza siljishi\u003c/td>\u003ctd>Test, bilish va tushunish\u003c/td>\u003ctd>4\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>9–10\u003c/td>\u003ctd>Avtotebranish, generator, rezonans\u003c/td>\u003ctd>Test, bilish\u003c/td>\u003ctd>2\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>11–12\u003c/td>\u003ctd>Formulalar, kattaliklar, tasdiqlar\u003c/td>\u003ctd>Qisqa javob, moslashtirish\u003c/td>\u003ctd>6 (har biri 3)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>13–15\u003c/td>\u003ctd>Hisoblash masalalari\u003c/td>\u003ctd>Qoʻllash\u003c/td>\u003ctd>10 (3 + 3 + 4)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>16\u003c/td>\u003ctd>Grafik va tahlil\u003c/td>\u003ctd>Yuqori tafakkur\u003c/td>\u003ctd>4\u003c/td>\u003c/tr>\n\u003ctr>\u003cth colspan=\"3\">Jami\u003c/th>\u003cth>30\u003c/th>\u003c/tr>\u003c/table>\u003c/div>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>Baholash mezoni\u003c/h3>\u003ctable>\u003ctr>\u003cth>Ball\u003c/th>\u003cth>Baho\u003c/th>\u003cth>Daraja\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>27–30\u003c/td>\u003ctd>5\u003c/td>\u003ctd>Yuqori\u003c/td>\u003c/tr>\u003ctr>\u003ctd>21–26\u003c/td>\u003ctd>4\u003c/td>\u003ctd>Yaxshi\u003c/td>\u003c/tr>\u003ctr>\u003ctd>15–20\u003c/td>\u003ctd>3\u003c/td>\u003ctd>Qoniqarli\u003c/td>\u003c/tr>\u003ctr>\u003ctd>0–14\u003c/td>\u003ctd>2\u003c/td>\u003ctd>Qoniqarsiz\u003c/td>\u003c/tr>\u003c/table>\n\u003cp class=\"sub\">Chegaralarni maktab ichki hujjatlariga muvofiq moslashtirish mumkin.\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>Natijalar jadvali (oʻqituvchi uchun)\u003c/h3>\u003cdiv class=\"scroll\">\u003ctable>\n\u003ctr>\u003cth>№\u003c/th>\u003cth>F.I.Sh.\u003c/th>\u003cth>Variant\u003c/th>\u003cth>1–10\u003c/th>\u003cth>11–12\u003c/th>\u003cth>13–15\u003c/th>\u003cth>16\u003c/th>\u003cth>Jami\u003c/th>\u003cth>Baho\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003c/div>\n\u003c/section>\n\u003csection id=\"s1\">\u003c/section>\u003csection id=\"s2\">\u003c/section>\u003csection id=\"s3\">\u003c/section>\n\u003c/main>\n\u003cscript>\nconst $=id=>document.getElementById(id),L=\"ABCD\";\nconst V=[\n{n:\"1-variant\",\n T:[[\"Tomson formulasi qaysi?\",[\"T = 2π√(L/C)\",\"T = 2π√(LC)\",\"T = 2π/√(LC)\",\"T = √(LC)/2π\"],1],\n [\"Kondensator sigʻimi 4 marta orttirilsa, kontur tebranish davri:\",[\"4 marta ortadi\",\"2 marta kamayadi\",\"2 marta ortadi\",\"oʻzgarmaydi\"],2],\n [\"q = q_m·cos ωt tenglamali konturda t = T/2 paytda:\",[\"q = 0, i maksimal\",\"q = −q_m, i = 0\",\"q = q_m, i = 0\",\"q = 0, i = 0\"],1],\n [\"Ideal konturning toʻliq energiyasi uchun NOTOʻGʻRI ifoda:\",[\"CU²/2 + LI²/2\",\"q_m²/2C\",\"LI_m²/2\",\"q_m²/2L\"],3],\n [\"Tarmoqning ta’sir etuvchi kuchlanishi 220 V. Amplituda qiymati taxminan:\",[\"156 V\",\"220 V\",\"311 V\",\"440 V\"],2],\n [\"Kondensatorli zanjirda tok kuchlanishga nisbatan:\",[\"π/2 ga ilgarilaydi\",\"π/2 ga kechikadi\",\"π ga kechikadi\",\"bir fazada\"],0],\n [\"Induktiv gʻaltakli zanjirda tok kuchlanishga nisbatan:\",[\"π/2 ga ilgarilaydi\",\"bir fazada\",\"π/2 ga kechikadi\",\"π ga ilgarilaydi\"],2],\n [\"Chastota ortganda X_L va X_C qanday oʻzgaradi?\",[\"ikkalasi ortadi\",\"X_L ortadi, X_C kamayadi\",\"X_L kamayadi, X_C ortadi\",\"ikkalasi kamayadi\"],1],\n [\"Quyidagilardan qaysi biri avtotebranish tizimi?\",[\"bir marta turtilgan mayatnik\",\"urilgan kamerton\",\"devor soati\",\"yuklangan prujina\"],2],\n [\"Rezonans paytida majburiy tebranishlar chastotasi:\",[\"xususiy chastotadan 2 marta katta\",\"xususiy chastotaga teng\",\"nolga teng\",\"cheksiz katta\"],1]],\n Q:[[\"X\u003csub>C\u003c/sub> va X\u003csub>L\u003c/sub> formulalarini yozing, birliklarini koʻrsating va chastotaga qanday bogʻliqligini izohlang.\",3],\n [\"Kattaliklarni birliklar bilan moslang: 1) induktivlik, 2) sigʻim, 3) siklik chastota, 4) sigʻim qarshiligi, 5) chastota, 6) elektr zaryadi. a) Farad, b) Om, c) Kulon, d) Gers, e) Genri, f) rad/s.\",3],\n [\"L = 25 mH, C = 4 μF boʻlgan tebranish konturining davri va chastotasini toping.\",3],\n [\"C = 20 μF kondensator ν = 50 Hz, U = 220 V (ta’sir etuvchi) tarmoqqa ulangan. Sigʻim qarshiligi va tok kuchini toping.\",3],\n [\"C = 2 μF kondensator U = 100 V gacha zaryadlanib, L = 0,5 mH gʻaltakka ulandi. Konturning toʻliq energiyasini, maksimal tok kuchini va tebranish davrini toping.\",4],\n [\"u = U\u003csub>m\u003c/sub> sin ωt kuchlanishda bir davr uchun kondensator va gʻaltakdagi tok kuchi grafiklarini kuchlanish grafigi bilan bitta koordinata tizimida chizing; har bir holda fazalar farqini yozing.\",4]],\n K:[\"1-B, 2-C, 3-B, 4-D, 5-C, 6-A, 7-C, 8-B, 9-C, 10-B\",\n \"X\u003csub>C\u003c/sub> = 1/(ωC) = 1/(2πνC), X\u003csub>L\u003c/sub> = ωL = 2πνL — 1 ball (ikkala formula). Birligi Om — 1 ball. X\u003csub>C\u003c/sub> chastota ortganda kamayadi, X\u003csub>L\u003c/sub> ortadi — 1 ball.\",\n \"1-e, 2-a, 3-f, 4-b, 5-d, 6-c. Har bir toʻgʻri moslik — 0,5 ball.\",\n \"T = 2π√(LC) — 1 ball. LC = 2,5·10⁻²·4·10⁻⁶ = 10⁻⁷, T = 2π·3,16·10⁻⁴ ≈ 1,99·10⁻³ s ≈ 2 ms — 1 ball. ν = 1/T ≈ 503 Hz — 1 ball.\",\n \"X\u003csub>C\u003c/sub> = 1/(2πνC) — 1 ball. X\u003csub>C\u003c/sub> = 1/(2·3,14·50·2·10⁻⁵) ≈ 159 Ω — 1 ball. I = U/X\u003csub>C\u003c/sub> = 220/159 ≈ 1,38 A — 1 ball.\",\n \"W = CU²/2 = 2·10⁻⁶·10⁴/2 = 10⁻² J = 10 mJ — 1 ball. LI\u003csub>m\u003c/sub>²/2 = W (energiya saqlanishi) — 1 ball. I\u003csub>m\u003c/sub> = √(2W/L) = √(2·10⁻²/5·10⁻⁴) = √40 ≈ 6,3 A — 1 ball. T = 2π√(LC) = 2π√(10⁻⁹) ≈ 2·10⁻⁴ s — 1 ball.\",\n \"Kondensator (2 ball): i = I\u003csub>m\u003c/sub> cos ωt, tok kuchlanishdan π/2 (T/4) oldinda — egri chiziq 1, faza farqi 1. Gʻaltak (2 ball): i = −I\u003csub>m\u003c/sub> cos ωt, tok kuchlanishdan π/2 (T/4) kechikadi — egri chiziq 1, faza farqi 1.\"]},\n{n:\"2-variant\",\n T:[[\"Erkin elektromagnit tebranishlar qachon hosil boʻladi?\",[\"tashqi davriy kuch taʼsirida\",\"konturga bir marta energiya berilgandan keyin\",\"faqat tranzistor bilan\",\"doimiy tok ulanganda\"],1],\n [\"Gʻaltak induktivligi 9 marta orttirilsa, kontur tebranish davri:\",[\"3 marta ortadi\",\"9 marta ortadi\",\"3 marta kamayadi\",\"oʻzgarmaydi\"],0],\n [\"q = q_m·cos ωt tenglamali konturda t = T/4 paytda energiya:\",[\"toʻliq elektr maydonda\",\"teng boʻlingan\",\"nolga teng\",\"toʻliq magnit maydonda\"],3],\n [\"q_m²/2C ifoda nimani bildiradi?\",[\"maksimal tok kuchini\",\"kontur toʻliq energiyasini\",\"kuchlanishni\",\"tebranish davrini\"],1],\n [\"Kuchlanish amplitudasi 141 V boʻlsa, ta’sir etuvchi qiymati taxminan:\",[\"70,7 V\",\"100 V\",\"141 V\",\"200 V\"],1],\n [\"Oʻzgaruvchan tok chastotasi 2 marta ortsa, kondensator sigʻim qarshiligi:\",[\"2 marta ortadi\",\"4 marta kamayadi\",\"2 marta kamayadi\",\"oʻzgarmaydi\"],2],\n [\"Kondensatorda oʻrtacha quvvat:\",[\"nolga teng\",\"U·I\",\"U·I/2\",\"U_m·I_m\"],0],\n [\"Chastota ortganda induktiv qarshilik X_L:\",[\"kamayadi\",\"oʻzgarmaydi\",\"ortadi\",\"nolga intiladi\"],2],\n [\"Tranzistorli generatorda teskari aloqaning vazifasi:\",[\"manbani zaryadlash\",\"kontur chastotasini oshirish\",\"energiyani konturga toʻgʻri fazada qaytarish\",\"tokni oʻchirish\"],2],\n [\"Konturning xususiy chastotasi formulasi:\",[\"ν = 2π√(LC)\",\"ν = √(LC)\",\"ν = 1/√(LC)\",\"ν = 1/(2π√(LC))\"],3]],\n Q:[[\"Mexanik va elektromagnit tebranishlar oʻxshashligi: siljish x, tezlik v, massa m, bikrlik k, kx²/2, mv²/2 ga mos elektr kattaliklarni yozing.\",3],\n [\"Har bir tasdiq uchun «chin» yoki «yolgʻon» deb yozing: 1) kondensator oʻzgarmas tokni (barqaror holatda) oʻtkazmaydi; 2) ideal konturda tebranishlar soʻnmaydi; 3) X\u003csub>L\u003c/sub> chastotaga teskari proporsional; 4) avtotebranish uchun tashqi davriy kuch zarur; 5) gʻaltakda oʻrtacha quvvat nolga teng; 6) kondensatorda tok kuchlanishdan kechikadi.\",3],\n [\"Tebranish konturi ν = 500 kHz chastotaga sozlangan, L = 100 μH. Kondensator sigʻimini toping.\",3],\n [\"L = 0,2 H gʻaltak ν = 50 Hz, U = 100 V (ta’sir etuvchi) tarmoqqa ulangan. Induktiv qarshilik va tok kuchini toping.\",3],\n [\"C\u003csub>1\u003c/sub> = 3 μF va C\u003csub>2\u003c/sub> = 6 μF kondensatorlar ketma-ket ulanib, U = 120 V, ν = 50 Hz tarmoqqa qoʻshilgan. Umumiy sigʻimni, tok kuchini va har bir kondensatordagi kuchlanishni toping.\",4],\n [\"Ideal konturda q = q_m·cos ωt. W\u003csub>E\u003c/sub> va W\u003csub>M\u003c/sub> ning bir davr uchun grafiklarini bitta koordinata tizimida chizing; ularning yigʻindisi nimaga teng ekanini va energiya oʻzgarish chastotasi zaryad tebranish chastotasidan necha marta farq qilishini yozing.\",4]],\n K:[\"1-B, 2-A, 3-D, 4-B, 5-B, 6-C, 7-A, 8-C, 9-C, 10-D\",\n \"x ↔ q, v ↔ i, m ↔ L, k ↔ 1/C, kx²/2 ↔ q²/2C, mv²/2 ↔ Li²/2. Har biri — 0,5 ball.\",\n \"1 — chin, 2 — chin, 3 — yolgʻon, 4 — yolgʻon, 5 — chin, 6 — yolgʻon. Har biri — 0,5 ball.\",\n \"C = 1/(4π²ν²L) — 1 ball. ν² = 2,5·10¹¹; maxraj = 39,5·2,5·10¹¹·10⁻⁴ ≈ 9,9·10⁸ — 1 ball. C ≈ 1,0·10⁻⁹ F = 1 nF — 1 ball.\",\n \"X\u003csub>L\u003c/sub> = 2πνL — 1 ball. X\u003csub>L\u003c/sub> = 2·3,14·50·0,2 ≈ 62,8 Ω — 1 ball. I = U/X\u003csub>L\u003c/sub> = 100/62,8 ≈ 1,6 A — 1 ball.\",\n \"C = C\u003csub>1\u003c/sub>C\u003csub>2\u003c/sub>/(C\u003csub>1\u003c/sub>+C\u003csub>2\u003c/sub>) = 2 μF — 1 ball. X\u003csub>C\u003c/sub> = 1/(2πνC) ≈ 1592 Ω — 1 ball. I = U/X\u003csub>C\u003c/sub> ≈ 0,075 A = 75 mA — 1 ball. U\u003csub>1\u003c/sub> = I·X\u003csub>1\u003c/sub> ≈ 80 V (X\u003csub>1\u003c/sub> ≈ 1061 Ω), U\u003csub>2\u003c/sub> ≈ 40 V; tekshiruv 80 + 40 = 120 V — 1 ball.\",\n \"Grafik (2 ball): W\u003csub>E\u003c/sub> = W·cos²ωt va W\u003csub>M\u003c/sub> = W·sin²ωt — har bir egri chiziq 1 ball. Yigʻindi W\u003csub>E\u003c/sub> + W\u003csub>M\u003c/sub> = W = const — 1 ball. Energiya oʻzgarish davri T/2, ya’ni chastotasi 2 marta katta — 1 ball.\"]}];\nfunction paper(v){return `\u003ch2>Fizika, 11-sinf. 1-chorak CHSB · ${v.n}\u003c/h2>\n\u003cdiv class=\"who\">\u003cspan>Maktab: \u003c/span>\u003cspan>Sinf: \u003c/span>\u003cspan>F.I.Sh.: \u003c/span>\u003cspan>Sana: \u003c/span>\u003c/div>\n\u003cp class=\"sub\">Vaqt: 45 daqiqa · Jami: 30 ball\u003c/p>\n\u003ch3>1-qism. Testlar (1–10, har biri 1 ball)\u003c/h3>\n${v.T.map((q,i)=>`\u003cdiv class=\"t\">\u003cb>${i+1}.\u003c/b> ${q[0]}${q[1].map((o,j)=>`\u003cdiv class=\"o\">${L[j]}) ${o}\u003c/div>`).join(\"\")}\u003c/div>`).join(\"\")}\n\u003ch3>2-qism. Qisqa javob (11–12, har biri 3 ball)\u003c/h3>\n${v.Q.slice(0,2).map((q,i)=>`\u003cdiv class=\"t\">\u003cb>${i+11}.\u003c/b> ${q[0]} \u003cspan class=\"pts\">[${q[1]} ball]\u003c/span>\u003cdiv class=\"ans\">\u003c/div>\u003c/div>`).join(\"\")}\n\u003ch3>3-qism. Masalalar (13–15)\u003c/h3>\n${v.Q.slice(2,5).map((q,i)=>`\u003cdiv class=\"t\">\u003cb>${i+13}.\u003c/b> ${q[0]} \u003cspan class=\"pts\">[${q[1]} ball]\u003c/span>\u003cdiv class=\"ans\" style=\"min-height:110px\">\u003c/div>\u003c/div>`).join(\"\")}\n\u003ch3>4-qism. Tahlil (16)\u003c/h3>\n\u003cdiv class=\"t\">\u003cb>16.\u003c/b> ${v.Q[5][0]} \u003cspan class=\"pts\">[${v.Q[5][1]} ball]\u003c/span>\u003cdiv class=\"ans\" style=\"min-height:160px\">\u003c/div>\u003c/div>`}\nconst names=[\"📋 Spetsifikatsiya\",\"1-variant\",\"2-variant\",\"🔑 Kalit va mezon\"],nav=$(\"nav\");\nnames.forEach((t,i)=>{const b=document.createElement(\"button\");b.textContent=t;b.onclick=()=>show(i);nav.appendChild(b)});\nfunction show(k){[...nav.children].forEach((b,i)=>b.classList.toggle(\"on\",i==k));for(let i=0;i\u003c4;i++)$(\"s\"+i).classList.toggle(\"on\",i==k);scrollTo(0,0)}\n$(\"s1\").innerHTML=paper(V[0]);$(\"s2\").innerHTML=paper(V[1]);\n$(\"s3\").innerHTML=\"\u003ch2>Javoblar kaliti va baholash mezoni (oʻqituvchi uchun)\u003c/h2>\"+V.map(v=>`\u003cdiv class=\"card\">\u003ch3>${v.n}\u003c/h3>\n\u003cp>\u003cb>1–10 (testlar, har biri 1 ball):\u003c/b> ${v.K[0]}\u003c/p>\n\u003cdiv class=\"scroll\">\u003ctable>\u003ctr>\u003cth>№\u003c/th>\u003cth>Ball\u003c/th>\u003cth>Toʻgʻri javob va ball taqsimoti\u003c/th>\u003c/tr>\n${v.K.slice(1).map((k,i)=>`\u003ctr>\u003ctd>${i+11}\u003c/td>\u003ctd>${v.Q[i][1]}\u003c/td>\u003ctd>${k}\u003c/td>\u003c/tr>`).join(\"\")}\u003c/table>\u003c/div>\n\u003cp class=\"sub\">Oʻquvchi boshqa toʻgʻri usul bilan yechsa, toʻliq ball beriladi. Hisob xatosi bor, lekin formula va yoʻnalish toʻgʻri boʻlsa, shu bosqichning ballidan 1 ball ayiriladi.\u003c/p>\u003c/div>`).join(\"\");\nshow(0);\n\u003c/script>\u003c/body>\u003c/html>\n"}, {"t": "Kondensator (AC)", "h": "\u003c!DOCTYPE html>\n\u003chtml lang=\"uz\">\u003chead>\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>Oʻzgaruvchan tok zanjiridagi kondensator — dars materiali\u003c/title>\n\u003cstyle>\n:root{--bg:#f6f7fb;--card:#fff;--tx:#1b2333;--mu:#5b667a;--ac:#1d6fd8;--ac2:#e8590c;--bd:#d9deea;--ok:#2b8a3e;--no:#c92a2a;color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root{--bg:#10141c;--card:#1a2030;--tx:#e8ecf5;--mu:#9aa6bd;--ac:#5aa2ff;--ac2:#ff9a5c;--bd:#2e3750;--ok:#6fcf86;--no:#ff8787;color-scheme:dark}}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif}\nheader,main{max-width:960px;margin:auto;padding:0 16px}header{padding-top:20px}\nh1{font-size:1.5rem;margin:0 0 4px}h2{font-size:1.25rem;margin:16px 0 8px;color:var(--ac)}h3{font-size:1.05rem;margin:12px 0 6px}\n.sub{color:var(--mu);margin:0 0 8px}\nnav{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;display:flex;gap:6px;overflow-x:auto;padding:8px 16px;max-width:960px;margin:auto}\nnav button{flex:0 0 auto;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:20px;font:inherit;cursor:pointer}\nnav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}\nsection{display:none;padding-bottom:40px}section.on{display:block}\n.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:12px 0}\n.f{font-family:Georgia,serif;font-size:1.05rem;color:var(--ac2);font-weight:600;white-space:nowrap}\ntable{border-collapse:collapse;width:100%;font-size:.93rem}th,td{border:1px solid var(--bd);padding:6px 8px;text-align:left;vertical-align:top}\nth{background:color-mix(in srgb,var(--ac) 14%,var(--card))}.scroll{overflow-x:auto}\ncanvas{width:100%;height:auto;border:1px solid var(--bd);border-radius:10px;background:var(--card);display:block}\n.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 16px;margin:10px 0}.ctl label{font-size:.9rem}.ctl input{width:100%}\nbutton.b{border:0;background:var(--ac);color:#fff;padding:9px 14px;border-radius:8px;font:inherit;cursor:pointer;margin:4px 6px 4px 0}button.b.alt{background:var(--ac2)}\n.out{display:flex;gap:8px;flex-wrap:wrap;font-size:.92rem}.out span{background:color-mix(in srgb,var(--ac) 12%,var(--card));padding:4px 10px;border-radius:8px}\n.bar{height:10px;background:var(--bd);border-radius:5px;margin:8px 0}.bar i{display:block;height:100%;background:var(--ac2);border-radius:5px;width:0}\n.q{margin:10px 0;padding-bottom:8px;border-bottom:1px solid var(--bd)}\n.o{display:block;width:100%;text-align:left;margin:4px 0;padding:8px 10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;font:inherit;cursor:pointer}\n.o.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.o.no{background:var(--no);color:#fff;border-color:var(--no)}\ntextarea{width:100%;min-height:300px;font:14px/1.5 ui-monospace,Consolas,monospace;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:10px}\nul{margin:4px 0 4px 18px;padding:0}.tag{display:inline-block;background:var(--ac2);color:#fff;border-radius:6px;padding:1px 8px;font-size:.8rem}\ndetails{margin:6px 0}summary{cursor:pointer;color:var(--ac);font-weight:600}\n\u003c/style>\u003c/head>\u003cbody>\n\u003cheader>\u003ch1>⚡ Oʻzgaruvchan tok zanjiridagi kondensator\u003c/h1>\n\u003cp class=\"sub\">11-sinf fizika · nazariya · simulyatsiya · dars rejasi · metodlar va oʻyinlar · 10 ta test · prompt\u003c/p>\u003c/header>\n\u003cnav id=\"nav\">\u003c/nav>\n\u003cmain>\n\u003csection id=\"s0\" class=\"on\">\n\u003ch2>1. Nazariya\u003c/h2>\n\u003cdiv class=\"card\">\u003ch3>Asosiy gʻoya\u003c/h3>\n\u003cp>Kondensator plastinalari orasida dielektrik bor, shuning uchun \u003cb>oʻzgarmas tok\u003c/b> (barqaror holatda) kondensatordan oʻtmaydi. Oʻzgaruvchan kuchlanishda esa plastinalar har chorak davrda zaryadlanadi va razryadlanadi: zaryad zanjirdagi simlar boʻylab oqadi. Dielektrikdan hech narsa oʻtmasa ham, zanjirda \u003cb>tok bor\u003c/b>, shuning uchun lampochka yonadi.\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>Asosiy formulalar\u003c/h3>\u003cdiv class=\"scroll\">\u003ctable>\n\u003ctr>\u003cth>Formula\u003c/th>\u003cth>Izohi\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd class=\"f\">u = U\u003csub>m\u003c/sub> sin ωt\u003c/td>\u003ctd>Kondensatorga berilgan kuchlanish; ω = 2πν.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"f\">q = Cu = CU\u003csub>m\u003c/sub> sin ωt\u003c/td>\u003ctd>Plastina zaryadi kuchlanish bilan bir fazada oʻzgaradi.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"f\">i = q′ = ωCU\u003csub>m\u003c/sub> cos ωt\u003c/td>\u003ctd>Tok — zaryaddan hosila: i = I\u003csub>m\u003c/sub> sin(ωt + π/2), I\u003csub>m\u003c/sub> = ωCU\u003csub>m\u003c/sub>.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"f\">Δφ = +π/2\u003c/td>\u003ctd>\u003cb>Tok kuchlanishdan chorak davr (T/4) oldinda.\u003c/b> Eslab qolish: «kondensatorda tok oldin».\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"f\">X\u003csub>C\u003c/sub> = 1/(ωC) = 1/(2πνC)\u003c/td>\u003ctd>Sigʻim qarshiligi (Ω). Sigʻim yoki chastota qancha katta boʻlsa, X\u003csub>C\u003c/sub> shuncha kichik.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"f\">I = U/X\u003csub>C\u003c/sub>\u003c/td>\u003ctd>Om qonuni (ta’sir etuvchi qiymatlar uchun); I\u003csub>m\u003c/sub> = U\u003csub>m\u003c/sub>/X\u003csub>C\u003c/sub>.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"f\">U = U\u003csub>m\u003c/sub>/√2, I = I\u003csub>m\u003c/sub>/√2\u003c/td>\u003ctd>Ta’sir etuvchi (effektiv) qiymatlar. 220 V tarmoqda U\u003csub>m\u003c/sub> ≈ 311 V.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"f\">p = ui = (U\u003csub>m\u003c/sub>I\u003csub>m\u003c/sub>/2) sin 2ωt\u003c/td>\u003ctd>Oniy quvvat ishorasini oʻzgartiradi. \u003cb>Oʻrtacha quvvat P = 0\u003c/b>: energiya isrof boʻlmaydi, manba va kondensator orasida almashadi.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"f\">Q\u003csub>C\u003c/sub> = UI = U²/X\u003csub>C\u003c/sub>\u003c/td>\u003ctd>Reaktiv quvvat (var).\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"f\">W = CU²/2\u003c/td>\u003ctd>Kondensator maydon energiyasi (oniy qiymat uchun u ni qoʻying).\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"f\">1/C = 1/C\u003csub>1\u003c/sub> + 1/C\u003csub>2\u003c/sub>\u003c/td>\u003ctd>Ketma-ket ulash: X\u003csub>C\u003c/sub> lar qoʻshiladi, tok bir xil, kuchlanish sigʻimga teskari taqsimlanadi.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"f\">C = C\u003csub>1\u003c/sub> + C\u003csub>2\u003c/sub>\u003c/td>\u003ctd>Parallel ulash: sigʻimlar qoʻshiladi.\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>Oʻzgarmas va oʻzgaruvchan tok\u003c/h3>\u003cdiv class=\"scroll\">\u003ctable>\n\u003ctr>\u003cth>Kattalik\u003c/th>\u003cth>Oʻzgarmas tok\u003c/th>\u003cth>Oʻzgaruvchan tok\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Kondensator qarshiligi\u003c/td>\u003ctd>Cheksiz katta (ν = 0)\u003c/td>\u003ctd>X\u003csub>C\u003c/sub> = 1/(2πνC), chekli\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Tok\u003c/td>\u003ctd>Faqat zaryadlanish paytida qisqa vaqt\u003c/td>\u003ctd>Doimiy oʻzgarib turadi\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Oʻrtacha quvvat\u003c/td>\u003ctd>0\u003c/td>\u003ctd>0 (reaktiv quvvat bor)\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>Chastota qarshilikka qanday taʼsir qiladi? (C = 20 μF)\u003c/h3>\u003cdiv class=\"scroll\">\u003ctable>\n\u003ctr>\u003cth>ν\u003c/th>\u003cth>0\u003c/th>\u003cth>50 Hz\u003c/th>\u003cth>1 kHz\u003c/th>\u003cth>1 MHz\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>X\u003csub>C\u003c/sub>\u003c/td>\u003ctd>∞\u003c/td>\u003ctd>159 Ω\u003c/td>\u003ctd>7,96 Ω\u003c/td>\u003ctd>0,008 Ω\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cp class=\"sub\">Xulosa: kondensator past chastotani «toʻsadi», yuqori chastotani oʻtkazadi.\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>Hayotiy misollar\u003c/h3>\u003cul>\n\u003cli>\u003cb>Audio kuchaytirgich va mikrofon:\u003c/b> bogʻlovchi kondensator oʻzgarmas tashkil etuvchini toʻsadi, ovoz signalini oʻtkazadi.\u003c/li>\n\u003cli>\u003cb>Zaryadlagich adapteri va quvvat manbalari:\u003c/b> filtr kondensatorlari tebranishni silliqlaydi.\u003c/li>\n\u003cli>\u003cb>Radio va mobil aloqa:\u003c/b> L bilan birga tebranish konturini tashkil qilib, kerakli chastotaga sozlanadi.\u003c/li>\n\u003cli>\u003cb>Sanoat:\u003c/b> kondensator batareyalari reaktiv quvvatni kompensatsiya qilib, elektr isrofini kamaytiradi.\u003c/li>\n\u003cli>\u003cb>Sensorli ekran:\u003c/b> barmoq sigʻimni oʻzgartiradi, shu orqali bosilgan joy aniqlanadi.\u003c/li>\u003c/ul>\u003c/div>\n\u003c/section>\n\n\u003csection id=\"s1\">\u003ch2>2. Simulyatsiya\u003c/h2>\n\u003cdiv class=\"card\">\u003cp class=\"sub\">Slayderlarni suring: tok (toʻq sariq) kuchlanishdan (koʻk) T/4 oldin ekanini, X\u003csub>C\u003c/sub> va I\u003csub>m\u003c/sub> ning C va ν ga bogʻliqligini kuzating. Chap tomonda plastinalar zaryadi va tok nuqtalari.\u003c/p>\n\u003ccanvas id=\"cv\" width=\"700\" height=\"300\" role=\"img\" aria-label=\"Kondensator va u(t), i(t) grafiklari\">\u003c/canvas>\n\u003cdiv class=\"ctl\">\n\u003clabel>C = \u003cb id=\"vC\">\u003c/b> μF\u003cinput id=\"C\" type=\"range\" min=\"1\" max=\"100\" value=\"20\">\u003c/label>\n\u003clabel>ν = \u003cb id=\"vV\">\u003c/b> Hz\u003cinput id=\"V\" type=\"range\" min=\"10\" max=\"1000\" step=\"10\" value=\"50\">\u003c/label>\n\u003clabel>U\u003csub>m\u003c/sub> = \u003cb id=\"vU\">\u003c/b> V\u003cinput id=\"U\" type=\"range\" min=\"1\" max=\"311\" value=\"311\">\u003c/label>\u003c/div>\n\u003cbutton class=\"b alt\" id=\"pp\">⏸ Pauza\u003c/button>\n\u003cdiv class=\"out\">\u003cspan>X\u003csub>C\u003c/sub> = \u003cb id=\"oX\">\u003c/b>\u003c/span>\u003cspan>I\u003csub>m\u003c/sub> = \u003cb id=\"oM\">\u003c/b>\u003c/span>\u003cspan>I = \u003cb id=\"oI\">\u003c/b>\u003c/span>\u003cspan>Δφ = +90° (T/4)\u003c/span>\u003cspan>P\u003csub>oʻrt\u003c/sub> = 0\u003c/span>\u003c/div>\n\u003cp class=\"sub\" style=\"margin-top:8px\">Tok amplitudasi (logarifmik shkala):\u003c/p>\u003cdiv class=\"bar\">\u003ci id=\"bar\">\u003c/i>\u003c/div>\n\u003cp class=\"sub\">Ekrandagi tebranish haqiqiy chastotadan sekin koʻrsatilgan; chastota oshsa animatsiya tezlashadi.\u003c/p>\u003c/div>\u003c/section>\n\n\u003csection id=\"s2\">\u003ch2>3. Dars rejasi (45 daqiqa)\u003c/h2>\n\u003cdiv class=\"card\">\u003ch3>Dars maqsadi\u003c/h3>\u003cul>\n\u003cli>\u003cb>Taʼlimiy:\u003c/b> kondensatorning oʻzgaruvchan tok zanjiridagi ishini, X\u003csub>C\u003c/sub> va faza siljishini tushuntirish.\u003c/li>\n\u003cli>\u003cb>Rivojlantiruvchi:\u003c/b> grafik tahlil, hisoblash va oʻxshashlik asosida xulosa chiqarish koʻnikmasini rivojlantirish.\u003c/li>\n\u003cli>\u003cb>Tarbiyaviy:\u003c/b> jamoada ishlash, texnika va xavfsizlikka mas’uliyatli munosabat.\u003c/li>\u003c/ul>\n\u003ch3>Kutilayotgan natijalar\u003c/h3>\u003cul>\u003cli>X\u003csub>C\u003c/sub>, I, I\u003csub>m\u003c/sub> ni hisoblaydi va grafikda fazalarni solishtiradi.\u003c/li>\u003cli>«Kondensator oʻzgarmas tokni oʻtkazmaydi» tushunchasini asoslaydi.\u003c/li>\u003cli>Ketma-ket va parallel ulangan kondensatorlarni tahlil qiladi.\u003c/li>\u003c/ul>\n\u003cp>\u003cb>Dars turi:\u003c/b> yangi bilim berish. \u003cb>Jihozlar:\u003c/b> proyektor, shu fayl (simulyatsiya), lampochka + kondensator + oʻzgarmas/oʻzgaruvchan tok manbai (demonstratsiya), kartochkalar, stikerlar.\u003c/p>\n\u003cp>\u003cspan class=\"tag\">Muammoli savol\u003c/span> Dielektrik tok oʻtkazmasa, nega kondensatorli zanjirda lampochka yonadi?\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003cdiv class=\"scroll\">\u003ctable>\n\u003ctr>\u003cth>Vaqt\u003c/th>\u003cth>Bosqich / metod\u003c/th>\u003cth>Oʻqituvchi\u003c/th>\u003cth>Oʻquvchi\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>0–3\u003c/td>\u003ctd>Tashkiliy qism\u003c/td>\u003ctd>Salomlashadi, mavzuni eʼlon qiladi.\u003c/td>\u003ctd>Tayyorlanadi.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3–8\u003c/td>\u003ctd>\u003cb>Aqliy hujum\u003c/b> + demonstratsiya\u003c/td>\u003ctd>Lampochka oʻzgarmas tokda yonmasligini, oʻzgaruvchan tokda yonishini koʻrsatadi; savol beradi.\u003c/td>\u003ctd>Taxmin qiladi, fikrlarni aytadi.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>8–22\u003c/td>\u003ctd>Yangi mavzu: \u003cb>muammoli taʼlim\u003c/b> + simulyatsiya\u003c/td>\u003ctd>Formulalarni keltirib chiqaradi, 3-bo‘limdagi simulyatsiyani koʻrsatadi.\u003c/td>\u003ctd>\u003cb>Insert\u003c/b> jadvalini toʻldiradi (V — bilardim, + — yangi, − — ziddi, ? — tushunmadim).\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>22–30\u003c/td>\u003ctd>\u003cb>Klaster\u003c/b> (4 guruh)\u003c/td>\u003ctd>Markaz: «Kondensator AC da». Guruhlarga: X\u003csub>C\u003c/sub>, faza, quvvat, qoʻllanilishi.\u003c/td>\u003ctd>Klaster tuzadi, 1 daqiqada himoya qiladi.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>30–37\u003c/td>\u003ctd>Masala yechish + \u003cb>oʻyin\u003c/b> «Tezkor hisob»\u003c/td>\u003ctd>1- va 3-masalani tahlil qiladi, oʻyinni boshqaradi.\u003c/td>\u003ctd>2-masalani mustaqil yechadi, oʻyinda qatnashadi.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>37–42\u003c/td>\u003ctd>Mustahkamlash: test\u003c/td>\u003ctd>Testdan 5 ta savol beradi (qolganini uyga).\u003c/td>\u003ctd>Individual yechadi, oʻzaro tekshiradi.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>42–45\u003c/td>\u003ctd>Yakun, \u003cb>FSMU\u003c/b> refleksiya, uy vazifasi\u003c/td>\u003ctd>Baholaydi, vazifani tushuntiradi.\u003c/td>\u003ctd>«Fikrim… Sababi… Misol… Umumlashtirish…» ni yozadi.\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>Baholash (jami 10 ball)\u003c/h3>\u003ctable>\u003ctr>\u003cth>Mezon\u003c/th>\u003cth>Ball\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Nazariy javob\u003c/td>\u003ctd>0–3\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Masala yechish\u003c/td>\u003ctd>0–3\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Test\u003c/td>\u003ctd>0–2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Guruhdagi faollik, oʻyin\u003c/td>\u003ctd>0–2\u003c/td>\u003c/tr>\u003c/table>\n\u003cp class=\"sub\">9–10 — «5»; 7–8 — «4»; 5–6 — «3»; 5 dan kam — «2».\u003c/p>\n\u003ch3>Uy vazifasi\u003c/h3>\u003cul>\u003cli>Mavzuni oʻqib, formulalar konspektini tuzish.\u003c/li>\u003cli>Masala: C = 10 μF, ν = 400 Hz, U = 50 V. X\u003csub>C\u003c/sub> va I ni toping (javob: ≈ 39,8 Ω; ≈ 1,26 A).\u003c/li>\u003cli>Ijodiy: «Telefon zaryadlagichida kondensator nima uchun kerak?» — 5 gap.\u003c/li>\u003c/ul>\n\u003ch3>5 ta nazorat savoli\u003c/h3>\u003col>\u003cli>Nima uchun kondensatorli zanjirda tok bor, garchi dielektrik tok oʻtkazmasa ham?\u003c/li>\u003cli>X\u003csub>C\u003c/sub> nimalarga va qanday bogʻliq?\u003c/li>\u003cli>Tok va kuchlanish orasidagi faza siljishi qancha va qaysi biri oldinda?\u003c/li>\u003cli>Nima uchun kondensatorda oʻrtacha quvvat nolga teng?\u003c/li>\u003cli>Audio kuchaytirgichda bogʻlovchi kondensator qanday vazifa bajaradi?\u003c/li>\u003c/ol>\u003c/div>\u003c/section>\n\n\u003csection id=\"s3\">\u003ch2>4. Metodlar va oʻyinlar\u003c/h2>\n\u003cdiv class=\"card\">\u003ch3>Metodlar\u003c/h3>\u003cdiv class=\"scroll\">\u003ctable>\n\u003ctr>\u003cth>Metod\u003c/th>\u003cth>Qanday oʻtkaziladi\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>Aqliy hujum\u003c/b>\u003c/td>\u003ctd>Savol: «Kondensator oʻzgarmas tokni nega oʻtkazmaydi?» 5 daqiqada har kim bitta fikr aytadi, hammasi doskaga yoziladi, keyin tahlil qilinadi.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>Klaster\u003c/b>\u003c/td>\u003ctd>Markazda «Kondensator AC da», shoxlar: X\u003csub>C\u003c/sub>, faza, quvvat, qoʻllanilish. Guruh ishi, 1 daqiqada himoya.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>Insert\u003c/b>\u003c/td>\u003ctd>Matn oʻqilayotganda belgilar: V — bilardim, + — yangi, − — ziddi, ? — tushunmadim. Yakunda ustunlar toʻldiriladi.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>FSMU\u003c/b>\u003c/td>\u003ctd>Fikr — Sabab — Misol — Umumlashtirish. Masalan: «Yuqori chastotada kondensator tokni yaxshi oʻtkazadi — chunki X\u003csub>C\u003c/sub> kichik — masalan, radio — demak chastota ↑, X\u003csub>C\u003c/sub> ↓».\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>Zig-zag\u003c/b>\u003c/td>\u003ctd>4 guruh, har biri bir kichik mavzuni oʻrganadi (X\u003csub>C\u003c/sub>, faza, quvvat, ulanish), keyin aralash guruhlarda bir-biriga oʻrgatadi.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>Venn diagrammasi\u003c/b>\u003c/td>\u003ctd>Ikki doira: «Oʻzgarmas tok» va «Oʻzgaruvchan tok»; kondensatorning har ikkalasidagi xossalari yoziladi.\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>Oʻyinlar (sinfda)\u003c/h3>\u003cul>\n\u003cli>\u003cb>«Chin yoki yolgʻon»:\u003c/b> oʻqituvchi tasdiq oʻqiydi («Kondensatorda kuchlanish tokdan oldinda»). Oʻquvchilar yashil (chin) yoki qizil (yolgʻon) kartochka koʻtaradi. Xatosini tuzatgan qoʻshimcha ball oladi.\u003c/li>\n\u003cli>\u003cb>«Grafikni top»:\u003c/b> kartochkalarga u(t), i(t) grafiklari chizilgan: kondensator, rezistor, gʻaltak. Jamoalar kartochkani toʻgʻri qurilma bilan juftlaydi (kondensator: tok T/4 oldin).\u003c/li>\n\u003cli>\u003cb>«Fizik estafeta»:\u003c/b> jamoa a’zolari navbat bilan masala zanjirining bir bosqichini yechadi: ω → X\u003csub>C\u003c/sub> → I → Q\u003csub>C\u003c/sub>. Eng tez va toʻgʻri yechgan jamoa gʻolib.\u003c/li>\u003c/ul>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>Tezkor hisob (interaktiv oʻyin, 5 raund)\u003c/h3>\n\u003cp id=\"gq\" class=\"sub\">\u003c/p>\u003cdiv id=\"go\">\u003c/div>\u003cp id=\"gs\">\u003c/p>\u003cbutton class=\"b alt\" id=\"gr\">Qaytadan\u003c/button>\u003c/div>\u003c/section>\n\n\u003csection id=\"s4\">\u003ch2>5. Masalalar (oddiydan murakkabga)\u003c/h2>\n\u003cdiv class=\"card\">\u003cp>\u003cb>1-masala.\u003c/b> C = 20 μF kondensator ν = 50 Hz, U = 220 V tarmoqqa ulangan. X\u003csub>C\u003c/sub>, I va I\u003csub>m\u003c/sub> ni toping.\u003c/p>\n\u003cdetails open>\u003csummary>Yechimi\u003c/summary>\u003cp>X\u003csub>C\u003c/sub> = 1/(2πνC) = 1/(6,28·50·2·10⁻⁵) = 1/(314·2·10⁻⁵) ≈ 159 Ω. I = U/X\u003csub>C\u003c/sub> = 220/159 ≈ 1,38 A. I\u003csub>m\u003c/sub> = I√2 ≈ 1,95 A.\u003c/p>\u003c/details>\u003c/div>\n\u003cdiv class=\"card\">\u003cp>\u003cb>2-masala.\u003c/b> C = 4 μF kondensatordan ν = 50 Hz da I = 0,5 A tok oʻtmoqda. Kuchlanishni va reaktiv quvvatni toping.\u003c/p>\n\u003cdetails open>\u003csummary>Yechimi\u003c/summary>\u003cp>X\u003csub>C\u003c/sub> = 1/(314·4·10⁻⁶) ≈ 796 Ω. U = I·X\u003csub>C\u003c/sub> = 0,5·796 ≈ 398 V. Q\u003csub>C\u003c/sub> = UI ≈ 199 var.\u003c/p>\u003c/details>\u003c/div>\n\u003cdiv class=\"card\">\u003cp>\u003cb>3-masala.\u003c/b> C\u003csub>1\u003c/sub> = 3 μF va C\u003csub>2\u003c/sub> = 6 μF kondensatorlar ketma-ket ulanib, U = 120 V, ν = 50 Hz tarmoqqa qoʻshilgan. Umumiy sigʻim, tok va har bir kondensatordagi kuchlanishni toping.\u003c/p>\n\u003cdetails open>\u003csummary>Yechimi\u003c/summary>\u003cp>C = C\u003csub>1\u003c/sub>C\u003csub>2\u003c/sub>/(C\u003csub>1\u003c/sub>+C\u003csub>2\u003c/sub>) = 2 μF. X\u003csub>C\u003c/sub> = 1/(314·2·10⁻⁶) ≈ 1592 Ω; I = 120/1592 ≈ 0,075 A = 75 mA. X\u003csub>1\u003c/sub> = 1/(314·3·10⁻⁶) ≈ 1061 Ω, U\u003csub>1\u003c/sub> = I·X\u003csub>1\u003c/sub> ≈ 80 V. X\u003csub>2\u003c/sub> ≈ 531 Ω, U\u003csub>2\u003c/sub> ≈ 40 V. Tekshiruv: 80 + 40 = 120 V ✓ (kichik sigʻimda kuchlanish katta).\u003c/p>\u003c/details>\u003c/div>\u003c/section>\n\n\u003csection id=\"s5\">\u003ch2>6. Test (10 ta)\u003c/h2>\u003cdiv id=\"quiz\">\u003c/div>\n\u003cdiv class=\"card\">\u003cb id=\"qs\">Natija: 0 / 10\u003c/b>\u003cbr>\u003cbutton class=\"b\" id=\"qr\">Qaytadan\u003c/button>\u003c/div>\u003c/section>\n\n\u003csection id=\"s6\">\u003ch2>7. Prompt\u003c/h2>\n\u003cp class=\"sub\">Shu uslubdagi materialni istalgan mavzu uchun tayyorlash uchun nusxa oling; qavs ichini oʻzgartiring.\u003c/p>\n\u003ctextarea id=\"pt\" readonly>Sen tajribali fizika oʻqituvchisi va metodistsan. [MAVZU: Oʻzgaruvchan tok zanjiridagi kondensator] mavzusi boʻyicha [SINF: 11]-sinf uchun toʻliq dars materiali tuz. Dars 45 daqiqa, til — oʻzbek (lotin).\n\nQuyidagilarni kiritgin:\n1. Dars maqsadlari (taʼlimiy, tarbiyaviy, rivojlantiruvchi) va kutilayotgan natijalar.\n2. Dars turi, jihozlar va metodlar: Aqliy hujum, Klaster, Insert, FSMU, Zig-zag, Venn, muammoli taʼlim.\n3. Dars bosqichlari jadvali: vaqt (yigʻindisi aynan 45 daq.), oʻqituvchi va oʻquvchi faoliyati.\n4. Nazariy material oddiy tilda: asosiy tushunchalar, barcha formulalar, birliklar, grafiklar tavsifi, taqqoslash jadvali.\n5. Hayotiy misollar.\n6. 3 ta masala (oddiydan murakkabga), toʻliq yechimi bilan.\n7. 10 ta test (A, B, C, D), javoblar kaliti bilan (javoblar turli harflarga taqsimlansin).\n8. 5 ta nazorat savoli.\n9. 3 ta sinf oʻyini va qoidalari.\n10. Baholash rubrikasi (jami aynan 10 ball) va uyga vazifa.\n\nTalablar: ilmiy jihatdan aniq; formulalar birliklari mos kelsin; barcha hisob-kitoblarni qayta tekshir; ballar va vaqt yigʻindisi toʻgʻri boʻlsin; 11-sinf oʻquvchisi tushunadigan til; jadval va punktlar bilan.\n\nQoʻshimcha: shu mavzu uchun bitta HTML5 fayl tayyorla: nazariya, interaktiv simulyatsiya (canvas animatsiya, slayderlar, hisoblanayotgan kattaliklar), dars rejasi, interaktiv test va oʻyin. Oflayn ishlasin, tashqi kutubxonasiz, mobilga va tungi rejimga mos, chop etish uchun CSS boʻlsin.\u003c/textarea>\n\u003cbutton class=\"b\" id=\"cp\">Nusxa olish\u003c/button>\u003c/section>\n\u003c/main>\n\u003cscript>\nconst $=id=>document.getElementById(id),TAU=Math.PI*2;\nconst names=[\"📘 Nazariya\",\"🎛 Simulyatsiya\",\"📝 Dars rejasi\",\"🎲 Metod va oʻyin\",\"🧮 Masalalar\",\"✅ Test\",\"💬 Prompt\"],nav=$(\"nav\");\nnames.forEach((t,i)=>{const b=document.createElement(\"button\");b.textContent=t;b.onclick=()=>show(i);nav.appendChild(b)});\nfunction show(k){[...nav.children].forEach((b,i)=>b.classList.toggle(\"on\",i==k));for(let i=0;i\u003c7;i++)$(\"s\"+i).classList.toggle(\"on\",i==k);scrollTo(0,0)}\nshow(0);\n/* ---- Simulyatsiya ---- */\nconst cv=$(\"cv\"),g=cv.getContext(\"2d\");let ph=0,last=performance.now(),play=true;\nconst css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();\nconst dec=(v,d)=>v.toFixed(d).replace(\".\",\",\");\nfunction P(){const C=$(\"C\").value*1e-6,v=+$(\"V\").value,U=+$(\"U\").value,Xc=1/(TAU*v*C);return{v,U,Xc,Im:U/Xc}}\nfunction upd(){const p=P();$(\"vC\").textContent=$(\"C\").value;$(\"vV\").textContent=$(\"V\").value;$(\"vU\").textContent=$(\"U\").value;\n$(\"oX\").textContent=dec(p.Xc,p.Xc\u003c10?2:1)+\" Ω\";const a=p.Im;$(\"oM\").textContent=a\u003c1?dec(a*1e3,2)+\" mA\":dec(a,2)+\" A\";const e=a/Math.SQRT2;$(\"oI\").textContent=e\u003c1?dec(e*1e3,2)+\" mA\":dec(e,2)+\" A\";\n$(\"bar\").style.width=Math.max(2,Math.min(100,(Math.log10(a)+4.5)/7*100))+\"%\"}\n[\"C\",\"V\",\"U\"].forEach(k=>$(k).oninput=upd);upd();\n$(\"pp\").onclick=()=>{play=!play;$(\"pp\").textContent=play?\"⏸ Pauza\":\"▶ Davom\"};\nconst at=s=>s\u003c160?[30+s,50]:s\u003c360?[190,50+s-160]:s\u003c520?[190-(s-360),250]:[30,250-(s-520)];\nfunction frame(now){const dt=Math.min(.05,(now-last)/1e3);last=now;\nif(play)ph=(ph+dt*TAU/(3*Math.sqrt(50/P().v)))%(2*TAU);draw();requestAnimationFrame(frame)}\nfunction draw(){const tx=css(\"--tx\"),ac=css(\"--ac\"),a2=css(\"--ac2\"),mu=css(\"--mu\"),bd=css(\"--bd\"),card=css(\"--card\");\ng.clearRect(0,0,700,300);g.lineWidth=2.5;g.lineCap=\"round\";g.setLineDash([]);\nconst u=Math.sin(ph);\ng.strokeStyle=tx;g.beginPath();g.moveTo(30,50);g.lineTo(90,50);g.moveTo(130,50);g.lineTo(190,50);g.lineTo(190,250);g.lineTo(30,250);g.lineTo(30,50);g.stroke();\nconst pc=u>=0?a2:ac,mc=u>=0?ac:a2;g.lineWidth=6;g.strokeStyle=pc;g.beginPath();g.moveTo(90,30);g.lineTo(90,70);g.stroke();g.strokeStyle=mc;g.beginPath();g.moveTo(130,30);g.lineTo(130,70);g.stroke();\ng.font=\"bold 15px system-ui\";g.textAlign=\"center\";g.textBaseline=\"middle\";const n=Math.round(Math.abs(u)*4);\nfor(let k=0;k\u003cn;k++){const y=n===1?50:36+k*28/(n-1);g.fillStyle=pc;g.fillText(u>=0?\"+\":\"−\",80,y);g.fillStyle=mc;g.fillText(u>=0?\"−\":\"+\",140,y)}\nif(n>0){g.strokeStyle=mu;g.lineWidth=1.5;g.globalAlpha=.3+.7*Math.abs(u);const d=u>=0?1:-1;for(let k=0;k\u003c3;k++){const y=38+k*12;g.beginPath();g.moveTo(100+(d\u003c0?20:0),y);g.lineTo(120-(d\u003c0?20:0),y);g.moveTo(120-(d\u003c0?20:0)-d*5,y-4);g.lineTo(120-(d\u003c0?20:0),y);g.lineTo(120-(d\u003c0?20:0)-d*5,y+4);g.stroke()}g.globalAlpha=1}\ng.fillStyle=a2;for(let k=0;k\u003c30;k++){const s=((k*24+u*80)%720+720)%720,p=at(s);if(p[1]===50&&p[0]>88&&p[0]\u003c132)continue;g.beginPath();g.arc(p[0],p[1],3.5,0,TAU);g.fill()}\ng.fillStyle=card;g.strokeStyle=tx;g.lineWidth=2.5;g.beginPath();g.arc(30,150,18,0,TAU);g.fill();g.stroke();g.fillStyle=tx;g.font=\"bold 18px system-ui\";g.fillText(\"~\",30,150);\ng.font=\"13px system-ui\";g.fillStyle=mu;g.fillText(\"C\",110,95);g.fillText(\"q = C·u\",110,275);\n/* grafik */\nconst X0=260,Wd=420,gx=t=>X0+t/(2*TAU)*Wd;g.strokeStyle=bd;g.lineWidth=1;g.strokeRect(X0,20,Wd,260);g.beginPath();g.moveTo(X0,150);g.lineTo(X0+Wd,150);g.stroke();\ng.setLineDash([3,4]);for(let k=1;k\u003c8;k++){g.beginPath();g.moveTo(X0+k*Wd/8,20);g.lineTo(X0+k*Wd/8,280);g.stroke()}g.setLineDash([]);\nconst cu=(f,c)=>{g.st px;font:inherit;cursor:pointer;margin-right:6px}\n@media print{\n:root{--bg:#fff;--card:#fff;--tx:#000;--mu:#333;--ac:#000;--bd:#888}\nnav,header .b,.noprint,button{display:none!important}.card{border:0;padding:0}body{font-size:12.5pt}\nsection{break-after:page}.ans{break-inside:avoid}}\n\u003c/style>\u003c/head>\u003cbody>\n\u003cheader>\u003ch1>Fizika · 11-sinf · 1-chorak BSB\u003c/h1>\n\u003cp class=\"sub\">Boʻlim boʻyicha summativ baholash: «Elektromagnit tebranishlar» · 2 variant · 40 daqiqa · 20 ball\u003c/p>\n\u003cp class=\"noprint\">\u003cbutton class=\"b\" onclick=\"print()\">🖨 Joriy boʻlimni chop etish / PDF\u003c/button>\u003c/p>\u003c/header>\n\u003cnav id=\"nav\">\u003c/nav>\n\u003cmain>\n\u003csection id=\"s0\" class=\"on\">\n\u003ch2>Spetsifikatsiya\u003c/h2>\n\u003cdiv class=\"card\">\u003cp>\u003cb>Boʻlim:\u003c/b> Elektromagnit tebranishlar (erkin tebranishlar, tebranish konturi, Tomson formulasi, energiya almashinuvi, oʻzgaruvchan tok zanjirida kondensator, avtotebranish).\u003cbr>\n\u003cb>Vaqt:\u003c/b> 40 daqiqa. \u003cb>Jami ball:\u003c/b> 20. \u003cb>Variantlar:\u003c/b> 2 (mazmuni va qiyinligi teng). Kalkulyator ruxsat etiladi (π ≈ 3,14; √2 ≈ 1,41).\u003c/p>\n\u003cdiv class=\"scroll\">\u003ctable>\u003ctr>\u003cth>Topshiriq\u003c/th>\u003cth>Turi\u003c/th>\u003cth>Bilish darajasi\u003c/th>\u003cth>Ball\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1–6\u003c/td>\u003ctd>Yopiq test (4 variantli)\u003c/td>\u003ctd>Bilish va tushunish\u003c/td>\u003ctd>6 (har biri 1)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>7–8\u003c/td>\u003ctd>Qisqa javob, moslashtirish\u003c/td>\u003ctd>Bilish va qoʻllash\u003c/td>\u003ctd>4 (har biri 2)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>9–10\u003c/td>\u003ctd>Hisoblash masalasi\u003c/td>\u003ctd>Qoʻllash\u003c/td>\u003ctd>6 (har biri 3)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>11\u003c/td>\u003ctd>Tahlil, grafik yoki jadval\u003c/td>\u003ctd>Yuqori tafakkur (tahlil)\u003c/td>\u003ctd>4\u003c/td>\u003c/tr>\n\u003ctr>\u003cth colspan=\"3\">Jami\u003c/th>\u003cth>20\u003c/th>\u003c/tr>\u003c/table>\u003c/div>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>Baholash mezoni\u003c/h3>\u003ctable>\u003ctr>\u003cth>Ball\u003c/th>\u003cth>Baho\u003c/th>\u003cth>Daraja\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>18–20\u003c/td>\u003ctd>5\u003c/td>\u003ctd>Yuqori\u003c/td>\u003c/tr>\u003ctr>\u003ctd>14–17\u003c/td>\u003ctd>4\u003c/td>\u003ctd>Yaxshi\u003c/td>\u003c/tr>\u003ctr>\u003ctd>10–13\u003c/td>\u003ctd>3\u003c/td>\u003ctd>Qoniqarli\u003c/td>\u003c/tr>\u003ctr>\u003ctd>0–9\u003c/td>\u003ctd>2\u003c/td>\u003ctd>Qoniqarsiz\u003c/td>\u003c/tr>\u003c/table>\n\u003cp class=\"sub\">Baholash mezonini maktab ichki hujjatlariga muvofiq moslashtirish mumkin.\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>Natijalar jadvali (oʻqituvchi uchun)\u003c/h3>\u003cdiv class=\"scroll\">\u003ctable>\n\u003ctr>\u003cth>№\u003c/th>\u003cth>F.I.Sh.\u003c/th>\u003cth>Variant\u003c/th>\u003cth>1–6\u003c/th>\u003cth>7–8\u003c/th>\u003cth>9–10\u003c/th>\u003cth>11\u003c/th>\u003cth>Jami\u003c/th>\u003cth>Baho\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003c/div>\n\u003c/section>\n\u003csection id=\"s1\">\u003c/section>\u003csection id=\"s2\">\u003c/section>\u003csection id=\"s3\">\u003c/section>\n\u003c/main>\n\u003cscript>\nconst $=id=>document.getElementById(id),L=\"ABCD\";\nconst V=[\n{n:\"1-variant\",\n T:[[\"Tebranish konturi qanday qismlardan iborat?\",[\"rezistor va diod\",\"kondensator va gʻaltak\",\"transformator va lampa\",\"faqat gʻaltak\"],1],\n [\"L = 0,1 H, C = 10 μF boʻlgan konturning tebranish davri:\",[\"6,28 ms\",\"62,8 ms\",\"0,628 ms\",\"6,28 s\"],0],\n [\"q = q_m·cos ωt tenglamali konturda t = T/4 paytda energiya:\",[\"toʻliq elektr maydonda\",\"teng boʻlingan\",\"nolga teng\",\"toʻliq magnit maydonda\"],3],\n [\"Kondensatorli oʻzgaruvchan tok zanjirida tok kuchlanishga nisbatan:\",[\"π/2 ga kechikadi\",\"π ga kechikadi\",\"π/2 ga ilgarilaydi\",\"bir fazada\"],2],\n [\"Ta’sir etuvchi kuchlanish 220 V boʻlsa, amplitudasi taxminan:\",[\"220 V\",\"311 V\",\"156 V\",\"440 V\"],1],\n [\"Quyidagilardan qaysi biri avtotebranish tizimi?\",[\"bir marta turtilgan mayatnik\",\"tortib qoʻyib yuborilgan prujina\",\"devor soati\",\"urilgan kamerton\"],2]],\n q7:\"Tomson formulasini yozing va undagi har bir kattalik hamda uning birligini izohlang.\",\n q8:\"Kattaliklarni birliklar bilan moslang: 1) induktivlik, 2) sigʻim, 3) siklik chastota, 4) sigʻim qarshiligi. a) Om, b) rad/s, c) Genri, d) Farad.\",\n q9:\"L = 2 mH, C = 0,5 μF boʻlgan tebranish konturining davri va chastotasini toping.\",\n q10:\"Sigʻimi C = 50 μF kondensator ν = 50 Hz, U = 220 V (ta’sir etuvchi) tarmoqqa ulangan. Sigʻim qarshiligi va tok kuchini toping.\",\n q11:\"q = q_m·cos ωt qonun boʻyicha tebranayotgan ideal konturda t = 0, T/4, T/2, 3T/4 paytlar uchun q, i, W\u003csub>E\u003c/sub>, W\u003csub>M\u003c/sub> ni jadvalga yozing (W — toʻliq energiya, i = −I\u003csub>m\u003c/sub> sin ωt). Nima uchun W\u003csub>E\u003c/sub> + W\u003csub>M\u003c/sub> = const? Tushuntiring.\",\n key:{t:\"1-B, 2-A, 3-D, 4-C, 5-B, 6-C\",\n q7:\"T = 2π√(LC) — 1 ball. T — davr (s), L — induktivlik (H), C — sigʻim (F) — 1 ball (kamida ikki kattalik birligi bilan toʻgʻri boʻlsa 0,5 ball).\",\n q8:\"1-c, 2-d, 3-b, 4-a. Har bir toʻgʻri moslik — 0,5 ball.\",\n q9:\"Formula T = 2π√(LC) — 1 ball. LC = 2·10⁻³·5·10⁻⁷ = 10⁻⁹, T = 2π·3,16·10⁻⁵ ≈ 1,99·10⁻⁴ s ≈ 199 μs — 1 ball. ν = 1/T ≈ 5,03·10³ Hz ≈ 5 kHz — 1 ball.\",\n q10:\"X\u003csub>C\u003c/sub> = 1/(2πνC) — 1 ball. X\u003csub>C\u003c/sub> = 1/(2·3,14·50·5·10⁻⁵) ≈ 63,7 Ω — 1 ball. I = U/X\u003csub>C\u003c/sub> = 220/63,7 ≈ 3,5 A — 1 ball.\",\n q11:\"Jadval (3 ball, har bir toʻgʻri ustun — 0,75): t = 0: q = q_m, i = 0, W\u003csub>E\u003c/sub> = W, W\u003csub>M\u003c/sub> = 0. T/4: q = 0, i = −I\u003csub>m\u003c/sub>, W\u003csub>E\u003c/sub> = 0, W\u003csub>M\u003c/sub> = W. T/2: q = −q_m, i = 0, W\u003csub>E\u003c/sub> = W, W\u003csub>M\u003c/sub> = 0. 3T/4: q = 0, i = +I\u003csub>m\u003c/sub>, W\u003csub>E\u003c/sub> = 0, W\u003csub>M\u003c/sub> = W. Izoh (1 ball): ideal konturda qarshilik yoʻq, energiya yoʻqolmaydi, faqat elektr va magnit maydon orasida almashadi: W = q\u003csub>m\u003c/sub>²/2C = LI\u003csub>m\u003c/sub>²/2.\"}},\n{n:\"2-variant\",\n T:[[\"Erkin elektromagnit tebranishlar uchun nima zarur?\",[\"doimiy tashqi manba\",\"konturga bir marta berilgan energiya\",\"tashqi davriy kuch\",\"tranzistor\"],1],\n [\"Gʻaltak induktivligi 4 marta orttirilsa, tebranish davri:\",[\"2 marta ortadi\",\"4 marta ortadi\",\"oʻzgarmaydi\",\"2 marta kamayadi\"],0],\n [\"t = 0 paytda (q = q_m·cos ωt) kondensator va tok:\",[\"q = 0, i maksimal\",\"q = 0, i = 0\",\"q = q_m, i = 0\",\"q = q_m, i maksimal\"],2],\n [\"Oʻzgaruvchan tok chastotasi 2 marta ortsa, kondensator sigʻim qarshiligi:\",[\"2 marta ortadi\",\"4 marta kamayadi\",\"oʻzgarmaydi\",\"2 marta kamayadi\"],3],\n [\"Kuchlanish amplitudasi 141 V boʻlsa, ta’sir etuvchi qiymati taxminan:\",[\"70,7 V\",\"100 V\",\"141 V\",\"200 V\"],1],\n [\"Real konturda tebranishlar nima uchun soʻnadi?\",[\"kondensator sigʻimi oʻzgaradi\",\"gʻaltak magnit xossasini yoʻqotadi\",\"manba kuchlanishi pasayadi\",\"energiya issiqlikka aylanadi va tarqaladi\"],3]],\n q7:\"Mexanik tebranish kattaliklariga mos elektromagnit kattaliklarni yozing: siljish x, tezlik v, massa m, bikrlik k.\",\n q8:\"Tasdiqlarning har biri uchun «chin» yoki «yolgʻon» deb yozing: 1) kondensatorda oʻrtacha quvvat nolga teng; 2) kondensatorda tok kuchlanishdan kechikadi; 3) sigʻim qarshiligi chastotaga toʻgʻri proporsional; 4) ideal konturda toʻliq energiya oʻzgarmaydi.\",\n q9:\"Tebranish konturi ν = 1 MHz chastotaga sozlangan, L = 25,3 μH. Kondensator sigʻimini toping.\",\n q10:\"C = 10 μF kondensator ν = 400 Hz, U = 50 V (ta’sir etuvchi) manbaga ulangan. Sigʻim qarshiligi va tok kuchini toping.\",\n q11:\"Kondensatorli zanjirda kuchlanish u = U\u003csub>m\u003c/sub> sin ωt boʻlsa, bir davr uchun u(t) va i(t) grafiklarini bitta koordinata tizimida chizing, fazalar farqini koʻrsating. Nima uchun kondensatordagi oʻrtacha quvvat nolga teng? Tushuntiring.\",\n key:{t:\"1-B, 2-A, 3-C, 4-D, 5-B, 6-D\",\n q7:\"x ↔ q, v ↔ i, m ↔ L, k ↔ 1/C. Har biri — 0,5 ball.\",\n q8:\"1 — chin, 2 — yolgʻon, 3 — yolgʻon, 4 — chin. Har biri — 0,5 ball.\",\n q9:\"C = 1/(4π²ν²L) — 1 ball. 4π² ≈ 39,5; ν² = 10¹²; maxraj ≈ 39,5·10¹²·25,3·10⁻⁶ ≈ 10⁹ — 1 ball. C ≈ 10⁻⁹ F = 1 nF — 1 ball.\",\n q10:\"X\u003csub>C\u003c/sub> = 1/(2πνC) — 1 ball. X\u003csub>C\u003c/sub> = 1/(2·3,14·400·10⁻⁵) ≈ 39,8 Ω — 1 ball. I = U/X\u003csub>C\u003c/sub> = 50/39,8 ≈ 1,26 A — 1 ball.\",\n q11:\"Grafik (2 ball): u — sinusoida (0,5), i = I\u003csub>m\u003c/sub> cos ωt — kosinusoida (0,5), tok T/4 (π/2) oldinda (1). Izoh (2 ball): p = ui = (U\u003csub>m\u003c/sub>I\u003csub>m\u003c/sub>/2)·sin 2ωt ishorasi oʻzgaradi (1); kondensator zaryadlanganda energiya oladi, razryadlanganda manbaga qaytaradi, bir davrda p ning oʻrtachasi nol (1).\"}}];\nfunction paper(v){return `\u003ch2>Fizika, 11-sinf. 1-chorak BSB · ${v.n}\u003c/h2>\n\u003cdiv class=\"who\">\u003cspan>Maktab: \u003c/span>\u003cspan>Sinf: \u003c/span>\u003cspan>F.I.Sh.: \u003c/span>\u003cspan>Sana: \u003c/span>\u003c/div>\n\u003cp class=\"sub\">Vaqt: 40 daqiqa · Jami: 20 ball\u003c/p>\n\u003ch3>1-qism. Testlar (har biri 1 ball)\u003c/h3>\n${v.T.map((q,i)=>`\u003cdiv class=\"t\">\u003cb>${i+1}.\u003c/b> ${q[0]}${q[1].map((o,j)=>`\u003cdiv class=\"o\">${L[j]}) ${o}\u003c/div>`).join(\"\")}\u003c/div>`).join(\"\")}\n\u003ch3>2-qism. Qisqa javob (har biri 2 ball)\u003c/h3>\n\u003cdiv class=\"t\">\u003cb>7.\u003c/b> ${v.q7} \u003cspan class=\"pts\">[2 ball]\u003c/span>\u003cdiv class=\"ans\">\u003c/div>\u003c/div>\n\u003cdiv class=\"t\">\u003cb>8.\u003c/b> ${v.q8} \u003cspan class=\"pts\">[2 ball]\u003c/span>\u003cdiv class=\"ans\">\u003c/div>\u003c/div>\n\u003ch3>3-qism. Masalalar (har biri 3 ball)\u003c/h3>\n\u003cdiv class=\"t\">\u003cb>9.\u003c/b> ${v.q9} \u003cspan class=\"pts\">[3 ball]\u003c/span>\u003cdiv class=\"ans\" style=\"min-height:110px\">\u003c/div>\u003c/div>\n\u003cdiv class=\"t\">\u003cb>10.\u003c/b> ${v.q10} \u003cspan class=\"pts\">[3 ball]\u003c/span>\u003cdiv class=\"ans\" style=\"min-height:110px\">\u003c/div>\u003c/div>\n\u003ch3>4-qism. Tahlil (4 ball)\u003c/h3>\n\u003cdiv class=\"t\">\u003cb>11.\u003c/b> ${v.q11} \u003cspan class=\"pts\">[4 ball]\u003c/span>\u003cdiv class=\"ans\" style=\"min-height:150px\">\u003c/div>\u003c/div>`}\nconst names=[\"📋 Spetsifikatsiya\",\"1-variant\",\"2-variant\",\"🔑 Kalit va mezon\"],nav=$(\"nav\");\nnames.forEach((t,i)=>{const b=document.createElement(\"button\");b.textContent=t;b.onclick=()=>show(i);nav.appendChild(b)});\nfunction show(k){[...nav.children].forEach((b,i)=>b.classList.toggle(\"on\",i==k));for(let i=0;i\u003c4;i++)$(\"s\"+i).classList.toggle(\"on\",i==k);scrollTo(0,0)}\n$(\"s1\").innerHTML=paper(V[0]);$(\"s2\").innerHTML=paper(V[1]);\n$(\"s3\").innerHTML=\"\u003ch2>Javoblar kaliti va baholash mezoni (oʻqituvchi uchun)\u003c/h2>\"+V.map(v=>`\u003cdiv class=\"card\">\u003ch3>${v.n}\u003c/h3>\n\u003cp>\u003cb>1–6 (testlar, har biri 1 ball):\u003c/b> ${v.key.t}\u003c/p>\n\u003cdiv class=\"scroll\">\u003ctable>\u003ctr>\u003cth>№\u003c/th>\u003cth>Toʻgʻri javob va ball taqsimoti\u003c/th>\u003c/tr>\n${[\"q7\",\"q8\",\"q9\",\"q10\",\"q11\"].map((k,i)=>`\u003ctr>\u003ctd>${i+7}\u003c/td>\u003ctd>${v.key[k]}\u003c/td>\u003c/tr>`).join(\"\")}\u003c/table>\u003c/div>\n\u003cp class=\"sub\">Oʻquvchi boshqa toʻgʻri usul bilan yechsa, toʻliq ball beriladi. Hisob xatosi bor, lekin yoʻnalish va formula toʻgʻri boʻlsa, bu bosqichning ballidan 1 ball ayiriladi.\u003c/p>\u003c/div>`).join(\"\");\nshow(0);\n\u003c/script>\u003c/body>\u003c/html>\n"}]</script>
<script>

document.getElementById("pr").onclick=()=>{try{fr.contentWindow.focus();fr.contentWindow.print()}catch(e){print()}};
