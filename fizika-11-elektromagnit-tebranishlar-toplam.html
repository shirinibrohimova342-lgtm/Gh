<style>

<header><h1>11-sinf fizika · Elektromagnit tebranishlar</h1><button id="pr">🖨 Chop etish</button></header>

<script type="application/json" id="d">[{"t": "LC kontur", "h": "\u003c!DOCTYPE html>\n\u003chtml lang=\"uz\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>LC kontur: erkin elektromagnit tebranishlar\u003c/title>\n\u003cstyle>\n:root{--ink:#14213D;--blue:#2563C9;--red:#D1495B;--cop:#B5651D;--pur:#6D3FC0;--grn:#1B8A5A;--line:#C9D5DD;--bg:#EEF3F6}\n*{box-sizing:border-box}\nbody{margin:0;color:var(--ink);font:16px/1.5 \"Trebuchet MS\",system-ui,sans-serif;background:var(--bg);\nbackground-image:linear-gradient(#dfe8ed 1px,transparent 1px),linear-gradient(90deg,#dfe8ed 1px,transparent 1px);background-size:24px 24px}\nheader,main,footer{max-width:1100px;margin:0 auto;padding:0 16px}\nheader{padding-top:20px}\nh1{font:700 28px/1.2 Georgia,serif;margin:0 0 4px}\nheader p{margin:0 0 16px;max-width:70ch}\nmain{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px;align-items:start}\n@media(max-width:900px){main{grid-template-columns:1fr}}\n.col{display:grid;gap:16px}\n.panel{background:#fff;border:1px solid var(--line);border-radius:6px;padding:12px}\n.panel h2{font:700 17px Georgia,serif;margin:0 0 8px}\ncanvas{display:block;width:100%;height:auto}\n.status{margin:8px 0 0;padding:8px 10px;border-left:4px solid var(--blue);background:#f4f8fb;min-height:3.2em}\nlabel{display:flex;justify-content:space-between;font-size:14px;margin-top:8px}\ninput[type=range]{width:100%;accent-color:var(--blue)}\n.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}\nbutton{font:inherit;font-size:14px;padding:7px 12px;border:0;border-radius:4px;background:var(--ink);color:#fff;cursor:pointer}\nbutton.alt{background:#fff;color:var(--ink);border:1px solid var(--ink)}\nbutton:focus-visible,input:focus-visible{outline:3px solid #f2a900;outline-offset:2px}\ntable{width:100%;border-collapse:collapse;font-size:14px}\ntd{padding:3px 0;border-bottom:1px solid #e4ebf0}\ntd:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}\n.bar{display:grid;grid-template-columns:96px 1fr 78px;gap:8px;align-items:center;font-size:13px;margin:6px 0}\n.track{height:14px;background:#e8eef2;border-radius:3px;overflow:hidden}\n.track i{display:block;height:100%;width:0}\n.bar b{text-align:right;font-variant-numeric:tabular-nums}\n.note{font-size:13px;color:#4a5876;margin:6px 0 0}\nfooter{padding:16px;font-size:14px}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cheader>\n\u003ch1>Erkin elektromagnit tebranishlar\u003c/h1>\n\u003cp>LC kontur: energiya kondensatorning elektr maydoni va gʻaltakning magnit maydoni orasida almashadi, toʻliq energiya esa oʻzgarmaydi.\u003c/p>\n\u003c/header>\n\u003cmain>\n\u003csection class=\"col\">\n\u003cdiv class=\"panel\">\n\u003ccanvas id=\"circ\" width=\"700\" height=\"280\" role=\"img\" aria-label=\"LC kontur animatsiyasi\">\u003c/canvas>\n\u003cp class=\"status\" id=\"status\" aria-live=\"off\">\u003c/p>\n\u003c/div>\n\u003cdiv class=\"panel\">\n\u003ccanvas id=\"graph\" width=\"700\" height=\"440\" role=\"img\" aria-label=\"q(t), i(t) va energiya grafiklari\">\u003c/canvas>\n\u003c/div>\n\u003c/section>\n\u003caside class=\"col\">\n\u003cdiv class=\"panel\">\n\u003ch2>Boshqaruv\u003c/h2>\n\u003cdiv class=\"row\" style=\"margin-top:0\">\n\u003cbutton id=\"play\">Toʻxtatish\u003c/button>\n\u003cbutton id=\"reset\" class=\"alt\">Boshlangʻich holat\u003c/button>\n\u003c/div>\n\u003clabel for=\"L\">Induktivlik L \u003coutput id=\"oL\">\u003c/output>\u003c/label>\n\u003cinput type=\"range\" id=\"L\" min=\"1\" max=\"100\" step=\"1\" value=\"10\">\n\u003clabel for=\"C\">Sigʻim C \u003coutput id=\"oC\">\u003c/output>\u003c/label>\n\u003cinput type=\"range\" id=\"C\" min=\"1\" max=\"100\" step=\"1\" value=\"10\">\n\u003clabel for=\"Q\">Maksimal zaryad q_m \u003coutput id=\"oQ\">\u003c/output>\u003c/label>\n\u003cinput type=\"range\" id=\"Q\" min=\"1\" max=\"10\" step=\"1\" value=\"5\">\n\u003clabel for=\"V\">Animatsiya tezligi \u003coutput id=\"oV\">\u003c/output>\u003c/label>\n\u003cinput type=\"range\" id=\"V\" min=\"0.25\" max=\"2\" step=\"0.25\" value=\"1\">\n\u003cdiv class=\"row\" role=\"group\" aria-label=\"Davr choraklariga oʻtish\">\n\u003cbutton class=\"alt\" data-q=\"0\">t = 0\u003c/button>\n\u003cbutton class=\"alt\" data-q=\"1\">T/4\u003c/button>\n\u003cbutton class=\"alt\" data-q=\"2\">T/2\u003c/button>\n\u003cbutton class=\"alt\" data-q=\"3\">3T/4\u003c/button>\n\u003c/div>\n\u003cp class=\"note\">Ekranda bir tebranish \u003cb id=\"rVt\">\u003c/b> davom etadi: haqiqiy davr juda qisqa, shuning uchun sekinlashtirilgan, davrlar nisbati saqlanadi.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"panel\">\n\u003ch2>Kattaliklar\u003c/h2>\n\u003ctable>\n\u003ctr>\u003ctd>Davr T = 2π√(LC)\u003c/td>\u003ctd id=\"rT\">\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Chastota ν = 1/T\u003c/td>\u003ctd id=\"rN\">\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Siklik chastota ω = 1/√(LC)\u003c/td>\u003ctd id=\"rW\">\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Maksimal tok I_m = q_m·ω\u003c/td>\u003ctd id=\"rI\">\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Maksimal kuchlanish U_m = q_m/C\u003c/td>\u003ctd id=\"rU\">\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Toʻliq energiya W = q_m²/2C\u003c/td>\u003ctd id=\"rE\">\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Hozirgi zaryad q\u003c/td>\u003ctd id=\"rq\">\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Hozirgi tok i\u003c/td>\u003ctd id=\"ri\">\u003c/td>\u003c/tr>\n\u003c/table>\n\u003c/div>\n\u003cdiv class=\"panel\">\n\u003ch2>Energiya\u003c/h2>\n\u003cdiv class=\"bar\">\u003cspan>Elektr W_E\u003c/span>\u003cdiv class=\"track\">\u003ci id=\"bE\" style=\"background:var(--blue)\">\u003c/i>\u003c/div>\u003cb id=\"vE\">\u003c/b>\u003c/div>\n\u003cdiv class=\"bar\">\u003cspan>Magnit W_M\u003c/span>\u003cdiv class=\"track\">\u003ci id=\"bM\" style=\"background:var(--pur)\">\u003c/i>\u003c/div>\u003cb id=\"vM\">\u003c/b>\u003c/div>\n\u003cdiv class=\"bar\">\u003cspan>Toʻliq W\u003c/span>\u003cdiv class=\"track\">\u003ci id=\"bT\" style=\"background:var(--grn);width:100%\">\u003c/i>\u003c/div>\u003cb id=\"vT\">\u003c/b>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"panel\">\n\u003ch2>Mexanik oʻxshashlik\u003c/h2>\n\u003ccanvas id=\"mech\" width=\"340\" height=\"110\" role=\"img\" aria-label=\"Prujinali mayatnik\">\u003c/canvas>\n\u003cp class=\"note\">Siljish x ↔ zaryad q, tezlik v ↔ tok i, massa m ↔ induktivlik L, bikrlik k ↔ 1/C.\u003c/p>\n\u003c/div>\n\u003c/aside>\n\u003c/main>\n\u003cfooter>Yashil nuqtalar zaryad oqimini (tok yoʻnalishini) koʻrsatadi, binafsha chiziqlar magnit maydonni, kondensatordagi strelkalar elektr maydonni.\u003c/footer>\n\u003cscript>\nconst $=id=>document.getElementById(id);\nconst INK='#14213D',BLUE='#2563C9',RED='#D1495B',COP='#B5651D',PUR='#6D3FC0',GRN='#1B8A5A',GRID='#C9D5DD',TAU=Math.PI*2;\nconst S={phi:0,play:!matchMedia('(prefers-reduced-motion: reduce)').matches,last:0};\nlet cx,gx,mx;\nconst f=(v,d)=>v.toFixed(d).replace('.',',');\nfunction fit(c,W,H){const r=c.getBoundingClientRect().width,d=window.devicePixelRatio||1;c.width=Math.round(r*d);c.height=Math.round(r*d*H/W);const x=c.getContext('2d');x.setTransform(c.width/W,0,0,c.width/W,0,0);return x}\nfunction resize(){cx=fit($('circ'),700,280);gx=fit($('graph'),700,440);mx=fit($('mech'),340,110)}\nfunction P(){const L=$('L').value*1e-3,C=$('C').value*1e-6,qm=$('Q').value*1e-6,w=1/Math.sqrt(L*C);return{L,C,qm,w,T:TAU/w,Im:qm*w,Um:qm/C,W:qm*qm/(2*C)}}\nfunction line(x,pts){x.beginPath();pts.forEach((p,k)=>k?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.stroke()}\nfunction at(s){if(s\u003c440)return[130+s,40];s-=440;if(s\u003c200)return[570,40+s];s-=200;if(s\u003c440)return[570-s,240];s-=440;return[130,240-s]}\n\nfunction drawCirc(ph,p){\nconst x=cx,q=Math.cos(ph),i=-Math.sin(ph);\nx.clearRect(0,0,700,280);x.lineCap='round';x.lineJoin='round';x.setLineDash([]);\nx.strokeStyle=INK;x.lineWidth=3;\nline(x,[[130,115],[130,40],[570,40],[570,92]]);\nline(x,[[570,188],[570,240],[130,240],[130,165]]);\nx.strokeStyle=COP;x.lineWidth=4;\nfor(let k=0;k\u003c5;k++){x.beginPath();x.ellipse(570,100+k*20,20,8,0,0,TAU);x.stroke()}\n/* magnit maydon */\nconst a=Math.abs(i);\nif(a>0.03){x.strokeStyle=PUR;x.lineWidth=2;x.setLineDash([7,6]);x.lineDashOffset=q*60;x.globalAlpha=.15+.85*a;\nfor(let r=1;r\u003c=3;r++){x.beginPath();x.ellipse(570,140,35+r*22,55+r*12,0,0,TAU);x.stroke()}\nx.globalAlpha=1;x.setLineDash([]);x.lineDashOffset=0}\n/* kondensator */\nconst top=q>=0?RED:BLUE,bot=q>=0?BLUE:RED;\nx.lineWidth=6;x.strokeStyle=top;line(x,[[92,115],[168,115]]);x.strokeStyle=bot;line(x,[[92,165],[168,165]]);\nx.font='bold 16px sans-serif';x.textAlign='center';x.textBaseline='middle';\nconst n=Math.round(Math.abs(q)*6);\nfor(let k=0;k\u003cn;k++){const px=n===1?130:100+k*60/(n-1);x.fillStyle=top;x.fillText(q>=0?'+':'−',px,104);x.fillStyle=bot;x.fillText(q>=0?'−':'+',px,176)}\nconst m=Math.round(Math.abs(q)*5);\nif(m>0){x.strokeStyle='#3B4A66';x.lineWidth=1.5;x.globalAlpha=.3+.7*Math.abs(q);\nconst d=q>=0?1:-1,y0=d>0?121:159,y1=d>0?159:121;\nfor(let k=0;k\u003cm;k++){const px=m===1?130:105+k*50/(m-1);line(x,[[px,y0],[px,y1]]);line(x,[[px-4,y1-d*6],[px,y1],[px+4,y1-d*6]])}\nx.globalAlpha=1}\n/* tok yo'nalishi: nuqtalar */\nconst off=-q*150,N=40,per=1280;x.fillStyle=GRN;\nfor(let k=0;k\u003cN;k++){const s=((k*per/N+off)%per+per)%per,pt=at(s);if(pt[0]===130&&pt[1]>118&&pt[1]\u003c162)continue;x.beginPath();x.arc(pt[0],pt[1],3.5,0,TAU);x.fill()}\n/* yozuvlar */\nx.fillStyle=INK;x.font='bold 15px Georgia,serif';x.textAlign='center';\nx.fillText('C',60,140);x.fillText('L',630,140);\nx.font='13px sans-serif';\nx.fillText('q = '+f(q*p.qm*1e6,2)+' µC',350,125);\nx.fillText('i = '+f(i*p.Im*1e3,1)+' mA',350,150);\nx.fillStyle='#4a5876';\nx.fillText('elektr maydon E ∝ |q|',130,268);x.fillText('magnit maydon B ∝ |i|',570,268);\n}\n\nfunction curve(x,fn,col,w){x.strokeStyle=col;x.lineWidth=w||2.5;x.setLineDash([]);x.beginPath();for(let k=0;k\u003c=120;k++){const t=k/120*TAU,p=fn(t);k?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1])}x.stroke()}\nfunction drawGraph(ph){\nconst x=gx,X0=60,Wd=620,c=ph%TAU,gX=t=>X0+t/TAU*Wd;\nx.clearRect(0,0,700,440);x.lineCap='round';x.textBaseline='alphabetic';\nconst tl=['0','T/4','T/2','3T/4','T'];\n[[30,190,208],[250,410,428]].forEach(([a,b,ty])=>{\nx.strokeStyle=GRID;x.lineWidth=1;x.setLineDash([3,4]);\nfor(let k=0;k\u003c5;k++)line(x,[[X0+k*Wd/4,a],[X0+k*Wd/4,b]]);\nx.setLineDash([]);x.strokeStyle=INK;x.lineWidth=1.5;line(x,[[X0,a],[X0,b]]);\nx.fillStyle='#4a5876';x.font='12px sans-serif';x.textAlign='center';\nfor(let k=0;k\u003c5;k++)x.fillText(tl[k],X0+k*Wd/4,ty)});\nline(x,[[X0,110],[X0+Wd,110]]);line(x,[[X0,410],[X0+Wd,410]]);\nx.textAlign='right';x.font='12px sans-serif';x.fillStyle='#4a5876';\nx.fillText('+1',X0-8,44);x.fillText('0',X0-8,114);x.fillText('−1',X0-8,184);\nx.fillText('W',X0-8,274);x.fillText('0',X0-8,414);\nx.textAlign='left';x.font='bold 13px sans-serif';\nx.fillStyle=BLUE;x.fillText('q = q_m·cos ωt',X0,18);\nx.fillStyle=COP;x.fillText('i = −I_m·sin ωt',X0+150,18);\nx.fillStyle=BLUE;x.fillText('W_E = W·cos²ωt',X0,240);\nx.fillStyle=PUR;x.fillText('W_M = W·sin²ωt',X0+150,240);\nx.fillStyle=GRN;x.fillText('W = const',X0+300,240);\nconst fq=t=>[gX(t),110-Math.cos(t)*70],fi=t=>[gX(t),110+Math.sin(t)*70],\nfe=t=>[gX(t),410-Math.cos(t)**2*140],fm=t=>[gX(t),410-Math.sin(t)**2*140],fw=t=>[gX(t),270];\ncurve(x,fq,BLUE);curve(x,fi,COP);curve(x,fe,BLUE);curve(x,fm,PUR);curve(x,fw,GRN,2);\nx.strokeStyle=INK;x.lineWidth=1.5;x.globalAlpha=.6;line(x,[[gX(c),30],[gX(c),190]]);line(x,[[gX(c),250],[gX(c),410]]);x.globalAlpha=1;\n[[fq,BLUE],[fi,COP],[fe,BLUE],[fm,PUR],[fw,GRN]].forEach(([fn,col])=>{const pt=fn(c);x.fillStyle=col;x.beginPath();x.arc(pt[0],pt[1],5,0,TAU);x.fill()});\n}\n\nfunction drawMech(ph){\nconst x=mx,cm=200+Math.cos(ph)*80,v=-Math.sin(ph);\nx.clearRect(0,0,340,110);x.lineCap='round';x.lineJoin='round';x.setLineDash([]);\nx.strokeStyle=INK;x.lineWidth=3;line(x,[[15,20],[15,80]]);\nx.lineWidth=1.5;for(let k=0;k\u003c6;k++)line(x,[[15,22+k*11],[8,28+k*11]]);\nconst le=cm-22;x.strokeStyle=INK;x.lineWidth=2;x.beginPath();x.moveTo(15,50);\nfor(let k=1;k\u003c=10;k++)x.lineTo(15+(le-15)*k/11,50+(k%2?-9:9));x.lineTo(le,50);x.stroke();\nx.fillStyle=BLUE;x.fillRect(cm-22,32,44,36);\nx.strokeStyle=COP;x.fillStyle=COP;x.lineWidth=3;\nconst ax=cm+v*45;if(Math.abs(v)>.05){line(x,[[cm,88],[ax,88]]);const d=v>0?1:-1;line(x,[[ax-d*7,83],[ax,88],[ax-d*7,93]])}\nx.fillStyle='#4a5876';x.font='12px sans-serif';x.textAlign='center';x.fillText('x ~ q (koʻk)   v ~ i (to‘q sariq)'.replace('‘','ʻ'),200,106);\n}\n\nconst QT=['1-chorak: kondensator razryadlanadi. Elektr maydon energiyasi magnit maydonga oʻtadi.',\n'2-chorak: kondensator teskari qutbda zaryadlanadi. Magnit maydon energiyasi elektr maydonga qaytadi.',\n'3-chorak: kondensator yana razryadlanadi. Energiya yana magnit maydonga oʻtadi.',\n'4-chorak: kondensator dastlabki qutbda qayta zaryadlanadi. Energiya elektr maydonga qaytadi.'];\n\nfunction render(){\nconst p=P(),ph=S.phi,q=Math.cos(ph),i=-Math.sin(ph),we=q*q,wm=i*i;\n$('oL').textContent=$('L').value+' mH';$('oC').textContent=$('C').value+' µF';$('oQ').textContent=$('Q').value+' µC';$('oV').textContent='×'+f(+$('V').value,2);\n$('rVt').textContent=f(3*Math.sqrt(p.T/1.987e-3),1)+' s';\n$('rT').textContent=f(p.T*1e3,3)+' ms';$('rN').textContent=f(1/p.T,0)+' Hz';$('rW').textContent=f(p.w,0)+' rad/s';\n$('rI').textContent=f(p.Im*1e3,2)+' mA';$('rU').textContent=f(p.Um,2)+' V';$('rE').textContent=f(p.W*1e6,3)+' µJ';\n$('rq').textContent=f(q*p.qm*1e6,2)+' µC';$('ri').textContent=f(i*p.Im*1e3,2)+' mA';\n$('bE').style.width=(we*100)+'%';$('bM').style.width=(wm*100)+'%';\n$('vE').textContent=f(we*p.W*1e6,3)+' µJ';$('vM').textContent=f(wm*p.W*1e6,3)+' µJ';$('vT').textContent=f(p.W*1e6,3)+' µJ';\n$('status').textContent=QT[Math.min(3,Math.floor((ph%TAU)/(Math.PI/2)))];\ndrawCirc(ph,p);drawGraph(ph);drawMech(ph);\n}\nfunction tick(t){\nconst dt=Math.min(.05,(t-S.last)/1000||0);S.last=t;\nif(S.play){const p=P(),vt=3*Math.sqrt(p.T/1.987e-3);S.phi=(S.phi+dt*TAU/vt*$('V').value)%TAU}\nrender();requestAnimationFrame(tick)}\nfunction setPlay(v){S.play=v;$('play').textContent=v?'Toʻxtatish':'Davom ettirish'}\n$('play').onclick=()=>setPlay(!S.play);\n$('reset').onclick=()=>{S.phi=0;setPlay(false)};\ndocument.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{S.phi=b.dataset.q*Math.PI/2;setPlay(false)});\naddEventListener('resize',resize);\nresize();setPlay(S.play);requestAnimationFrame(tick);\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}, {"t": "Soʻnuvchi tebranishlar", "h": "\u003c!DOCTYPE html>\n\u003chtml lang=\"uz\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>So‘nuvchi elektromagnit tebranishlar — simulyatsiya\u003c/title>\n\u003cstyle>\n:root{--bg:#f3f7fb;--card:#fff;--ink:#182436;--muted:#5d6b7b;--blue:#1677d2;--orange:#e98225;--green:#15956b;--line:#dce5ef}\n*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Arial,sans-serif}\nheader{background:linear-gradient(120deg,#123b67,#1677d2);color:white;padding:24px 18px}\nheader .wrap,main{max-width:1100px;margin:auto}h1{font-size:clamp(1.5rem,4vw,2.25rem);margin:0 0 8px}header p{margin:0;opacity:.92}\nmain{padding:18px;display:grid;gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 5px 18px #20344a0b}\nh2{font-size:1.2rem;margin:0 0 12px}h3{font-size:1rem;margin:12px 0 6px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}\n.controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.control label{display:flex;justify-content:space-between;gap:8px;font-weight:650;font-size:.93rem}.control input{width:100%;accent-color:var(--blue)}.hint{color:var(--muted);font-size:.88rem}\n.buttons{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}button{border:0;border-radius:10px;padding:10px 15px;background:var(--blue);color:white;font-weight:700;cursor:pointer}button.secondary{background:#e7eef7;color:#20344a}button:focus-visible,input:focus-visible{outline:3px solid #f6b94b;outline-offset:2px}\ncanvas{width:100%;height:280px;display:block;border:1px solid var(--line);border-radius:10px;background:#fff}\n#circuit{height:220px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.stat{background:#f5f8fc;border-radius:10px;padding:10px}.stat span{display:block;color:var(--muted);font-size:.82rem}.stat strong{font-size:1.05rem}\n.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.9rem;margin:8px 0}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}\n.note{background:#eef7ff;border-left:4px solid var(--blue);padding:10px 12px;border-radius:8px}.formula{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;background:#f5f8fc;padding:10px;border-radius:8px;overflow-wrap:anywhere}\nfooter{text-align:center;color:var(--muted);padding:8px 18px 24px;font-size:.85rem}\n@media(max-width:760px){.grid,.controls{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:14px}canvas{height:250px}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cheader>\u003cdiv class=\"wrap\">\n\u003ch1>Elektromagnit tebranishlar: interaktiv simulyatsiya\u003c/h1>\n\u003cp>11-sinf fizika • Kondensator, induktiv g‘altak va qarshilik ta’sirida tebranishlarning o‘zgarishini kuzating.\u003c/p>\n\u003c/div>\u003c/header>\n\u003cmain>\n\u003csection class=\"card\">\n\u003ch2>1. Parametrlarni o‘zgartiring\u003c/h2>\n\u003cdiv class=\"controls\">\n\u003cdiv class=\"control\">\u003clabel for=\"L\">Induktivlik L \u003cspan id=\"Lv\">100 mH\u003c/span>\u003c/label>\u003cinput id=\"L\" type=\"range\" min=\"10\" max=\"300\" value=\"100\" step=\"10\">\u003cdiv class=\"hint\">G‘altakning magnit maydon bilan bog‘liq xossasi.\u003c/div>\u003c/div>\n\u003cdiv class=\"control\">\u003clabel for=\"C\">Sig‘im C \u003cspan id=\"Cv\">100 µF\u003c/span>\u003c/label>\u003cinput id=\"C\" type=\"range\" min=\"10\" max=\"500\" value=\"100\" step=\"10\">\u003cdiv class=\"hint\">Kondensatorning zaryad to‘plash qobiliyati.\u003c/div>\u003c/div>\n\u003cdiv class=\"control\">\u003clabel for=\"R\">Qarshilik R \u003cspan id=\"Rv\">20 Ω\u003c/span>\u003c/label>\u003cinput id=\"R\" type=\"range\" min=\"0\" max=\"100\" value=\"20\" step=\"1\">\u003cdiv class=\"hint\">Qarshilik oshsa, odatda tebranish tezroq so‘nadi.\u003c/div>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"buttons\">\u003cbutton id=\"play\">▶ Boshlash\u003c/button>\u003cbutton id=\"pause\" class=\"secondary\">Ⅱ To‘xtatish\u003c/button>\u003cbutton id=\"reset\" class=\"secondary\">↺ Qayta boshlash\u003c/button>\u003c/div>\n\u003cp class=\"hint\">Simulyatsiya soddalashtirilgan RLC kontur modelidan foydalanadi. Qiymatlar o‘zgartirilganda grafiklar qayta hisoblanadi.\u003c/p>\n\u003c/section>\n\n\u003csection class=\"card\">\n\u003ch2>2. Tebranish konturi animatsiyasi\u003c/h2>\n\u003ccanvas id=\"circuit\" aria-label=\"Kondensator va g‘altakli tebranish konturi animatsiyasi\">\u003c/canvas>\n\u003cdiv class=\"stats\">\n\u003cdiv class=\"stat\">\u003cspan>Davr T\u003c/span>\u003cstrong id=\"Tval\">—\u003c/strong>\u003c/div>\n\u003cdiv class=\"stat\">\u003cspan>Chastota ν\u003c/span>\u003cstrong id=\"nval\">—\u003c/strong>\u003c/div>\n\u003cdiv class=\"stat\">\u003cspan>So‘nish koeffitsiyenti β\u003c/span>\u003cstrong id=\"bval\">—\u003c/strong>\u003c/div>\n\u003cdiv class=\"stat\">\u003cspan>Vaqt t\u003c/span>\u003cstrong id=\"tval\">0.00 s\u003c/strong>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"note\">\u003cb>Kuzating:\u003c/b> kondensator zaryadi kamayganda tok hosil bo‘ladi; g‘altakda magnit maydon to‘planadi. Qarshilik energiyaning bir qismini issiqlikka aylantiradi, shu sabab amplituda pasayadi.\u003c/div>\n\u003c/section>\n\n\u003cdiv class=\"grid\">\n\u003csection class=\"card\">\n\u003ch2>3. Zaryadning vaqtga bog‘liqligi\u003c/h2>\n\u003cdiv class=\"legend\">\u003cspan>\u003ci class=\"dot\" style=\"background:#1677d2\">\u003c/i>So‘nuvchi zaryad q(t)\u003c/span>\u003cspan>\u003ci class=\"dot\" style=\"background:#a8b5c5\">\u003c/i>Amplituda chegarasi\u003c/span>\u003c/div>\n\u003ccanvas id=\"charge\" aria-label=\"Zaryadning vaqtga bog‘liq grafigi\">\u003c/canvas>\n\u003cp class=\"formula\">q(t) = q₀ · e\u003csup>−βt\u003c/sup> · cos(ω\u003csub>d\u003c/sub>t)\u003c/p>\n\u003cp class=\"hint\">Gorizontal o‘q — vaqt t (s), vertikal o‘q — zaryad q (nisbiy birlik). Egri chiziqning yuqori va pastki chegaralari amplitudaning kamayishini ko‘rsatadi.\u003c/p>\n\u003c/section>\n\u003csection class=\"card\">\n\u003ch2>4. Tok kuchining vaqtga bog‘liqligi\u003c/h2>\n\u003cdiv class=\"legend\">\u003cspan>\u003ci class=\"dot\" style=\"background:#e98225\">\u003c/i>Tok i(t), nisbiy birlik\u003c/span>\u003c/div>\n\u003ccanvas id=\"current\" aria-label=\"Tok kuchining vaqtga bog‘liq grafigi\">\u003c/canvas>\n\u003cp class=\"formula\">i(t) = dq/dt\u003c/p>\n\u003cp class=\"hint\">Tok kuchi zaryadning vaqt bo‘yicha o‘zgarish tezligidir. Tok va zaryad tebranishlari orasida faza farqi mavjud.\u003c/p>\n\u003c/section>\n\u003c/div>\n\n\u003csection class=\"card\">\n\u003ch2>5. Energiya almashinuvi\u003c/h2>\n\u003ccanvas id=\"energy\" aria-label=\"Elektr, magnit va yo‘qotilgan energiyaning o‘zgarishi\">\u003c/canvas>\n\u003cdiv class=\"legend\">\u003cspan>\u003ci class=\"dot\" style=\"background:#1677d2\">\u003c/i>Elektr maydon energiyasi\u003c/span>\u003cspan>\u003ci class=\"dot\" style=\"background:#15956b\">\u003c/i>Magnit maydon energiyasi\u003c/span>\u003cspan>\u003ci class=\"dot\" style=\"background:#e98225\">\u003c/i>Issiqlikka aylangan energiya\u003c/span>\u003c/div>\n\u003cdiv class=\"note\">Ideal konturda energiya elektr va magnit maydonlar orasida almashinadi. Haqiqiy konturda qarshilik sabab umumiy elektromagnit energiya kamayib boradi.\u003c/div>\n\u003c/section>\n\n\u003csection class=\"card\">\n\u003ch2>6. Asosiy formulalar va tushunchalar\u003c/h2>\n\u003cdiv class=\"grid\">\n\u003cdiv>\u003ch3>Ideal LC kontur\u003c/h3>\u003cp class=\"formula\">T = 2π√(LC)\u003c/p>\u003cp>Bu formula qarshilik e’tiborga olinmaydigan ideal kontur uchun qo‘llanadi.\u003c/p>\u003c/div>\n\u003cdiv>\u003ch3>Chastota va burchak chastota\u003c/h3>\u003cp class=\"formula\">ν = 1/T &nbsp; • &nbsp; ω = 2πν\u003c/p>\u003cp>ν — bir sekunddagi tebranishlar soni (Hz), ω — burchak chastota (rad/s).\u003c/p>\u003c/div>\n\u003cdiv>\u003ch3>So‘nish\u003c/h3>\u003cp class=\"formula\">β = R/(2L)\u003c/p>\u003cp>Bu yerda R — Ω, L — H; β ning birligi s⁻¹. Formula ketma-ket RLC konturining so‘nuvchi, tebranuvchi holatiga tegishli.\u003c/p>\u003c/div>\n\u003cdiv>\u003ch3>So‘nuvchi tebranish chastotasi\u003c/h3>\u003cp class=\"formula\">ω\u003csub>d\u003c/sub> = √(1/(LC) − β²)\u003c/p>\u003cp>Bu ifoda β² &lt; 1/(LC) bo‘lganda, ya’ni kontur tebranma so‘nish rejimida bo‘lganda ishlatiladi.\u003c/p>\u003c/div>\n\u003c/div>\n\u003cp class=\"hint\">Eslatma: animatsiya tushunchalarni ko‘rgazmali tushuntirish uchun normallashtirilgan (nisbiy) zaryad, tok va energiya qiymatlarini ko‘rsatadi; u laboratoriya o‘lchovi o‘rnini bosmaydi.\u003c/p>\n\u003c/section>\n\u003c/main>\n\u003cfooter>Interaktiv HTML5 fizika materiali • Internet talab qilmaydi — faylni brauzerda ochish kifoya.\u003c/footer>\n\u003cscript>\n(() => {\nconst $ = id => document.getElementById(id);\nconst Ls=$('L'), Cs=$('C'), Rs=$('R');\nlet running=false, time=0, last=0, raf=0;\nconst canvases=['circuit','charge','current','energy'].reduce((o,id)=>{o[id]=$(id);o[id].ctx=o[id].getContext('2d');return o;},{});\nfunction params(){\n const L=+Ls.value/1000, C=+Cs.value/1e6, R=+Rs.value;\n const beta=R/(2*L), w0=1/Math.sqrt(L*C), wd=Math.sqrt(Math.max(0,w0*w0-beta*beta));\n const T=wd>0?2*Math.PI/wd:2*Math.PI/w0, nu=1/T;\n $('Lv').textContent=Ls.value+' mH';$('Cv').textContent=Cs.value+' µF';$('Rv').textContent=Rs.value+' Ω';\n $('Tval').textContent=T.toFixed(4)+' s';$('nval').textContent=nu.toFixed(2)+' Hz';$('bval').textContent=beta.toFixed(2)+' s⁻¹';\n return {L,C,R,beta,w0,wd,T,nu};\n}\nfunction setup(c){const dpr=window.devicePixelRatio||1, r=c.getBoundingClientRect();c.width=Math.max(1,Math.round(r.width*dpr));c.height=Math.max(1,Math.round(r.height*dpr));const ctx=c.ctx;ctx.setTransform(dpr,0,0,dpr,0,0);return {ctx,w:r.width,h:r.height};}\nfunction axes(ctx,w,h,yLabel,maxT){\n const left=46,right=12,top=14,bottom=30, pw=w-left-right,ph=h-top-bottom;\n ctx.clearRect(0,0,w,h);ctx.font='12px system-ui';ctx.lineWidth=1;ctx.strokeStyle='#e5ebf2';\n for(let i=0;i\u003c=4;i++){let y=top+ph*i/4;ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(w-right,y);ctx.stroke();}\n for(let i=0;i\u003c=5;i++){let x=left+pw*i/5;ctx.beginPath();ctx.moveTo(x,top);ctx.lineTo(x,h-bottom);ctx.stroke();ctx.fillStyle='#637386';ctx.fillText((maxT*i/5).toFixed(maxT\u003c1?2:1),x-10,h-10);}\n ctx.strokeStyle='#8493a5';ctx.beginPath();ctx.moveTo(left,top);ctx.lineTo(left,h-bottom);ctx.lineTo(w-right,h-bottom);ctx.stroke();\n ctx.fillStyle='#334155';ctx.fillText(yLabel,6,12);ctx.fillText('t (s)',w-38,h-8);\n return {left,top,pw,ph,bottom};\n}\nfunction drawGraph(id,kind,p){\n const {ctx,w,h}=setup(canvases[id]), maxT=Math.max(.25,Math.min(2.5,p.T*5));\n const a=axes(ctx,w,h,kind==='q'?'q (nisbiy)':kind==='i'?'i (nisbiy)':'Energiya (nisbiy)',maxT);\n const beta=p.beta, wd=p.wd, decay=t=>Math.exp(-Math.min(30,beta*t));\n const q=t=>decay(t)*Math.cos(wd*t);\n const i=t=>decay(t)*(-beta*Math.cos(wd*t)-wd*Math.sin(wd*t))/Math.max(1,p.w0);\n function xy(t,v){return [a.left+(t/maxT)*a.pw,a.top+a.ph*(1-(v+1.1)/2.2)];}\n if(kind==='q'){\n  ctx.setLineDash([5,5]);ctx.strokeStyle='#a8b5c5';for(const sign of [-1,1]){ctx.beginPath();for(let k=0;k\u003c=250;k++){let t=maxT*k/250,y=sign*decay(t),[x,yy]=xy(t,y);k?ctx.lineTo(x,yy):ctx.moveTo(x,yy);}ctx.stroke();}ctx.setLineDash([]);\n }\n ctx.strokeStyle=kind==='q'?'#1677d2':'#e98225';ctx.lineWidth=2.4;ctx.beginPath();\n for(let k=0;k\u003c=500;k++){let t=maxT*k/500,v=kind==='q'?q(t):i(t),[x,y]=xy(t,Math.max(-1.1,Math.min(1.1,v)));k?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.stroke();\n if(kind==='q'&&beta===0){ctx.fillStyle='#1677d2';ctx.fillText('Amplituda o‘zgarmaydi (R = 0)',a.left+8,a.top+16);}\n}\nfunction drawCircuit(p){\n const {ctx,w,h}=setup(canvases.circuit);ctx.clearRect(0,0,w,h);\n ctx.font='13px system-ui';ctx.lineWidth=3;ctx.strokeStyle='#7a8a9c';ctx.fillStyle='#334155';\n const x1=w*.18,x2=w*.82,y1=h*.25,y2=h*.75;\n // wires with a top gap for resistor\n ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(w*.42,y1);ctx.lineTo(w*.42,y1-7);ctx.lineTo(w*.58,y1-7);ctx.lineTo(w*.58,y1);ctx.lineTo(x2,y1);ctx.lineTo(x2,y2);ctx.lineTo(x1,y2);ctx.lineTo(x1,y1);ctx.stroke();\n // capacitor plates\n ctx.strokeStyle='#1677d2';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x1-13,h*.43);ctx.lineTo(x1+13,h*.43);ctx.moveTo(x1-13,h*.52);ctx.lineTo(x1+13,h*.52);ctx.stroke();\n ctx.fillStyle='#1677d2';ctx.fillText('C',x1-5,h*.36);\n // coil at bottom\n ctx.strokeStyle='#15956b';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(w*.38,y2);for(let k=0;k\u003c5;k++)ctx.arc(w*.40+k*w*.045,y2, w*.022,Math.PI,0,true);ctx.lineTo(x2,y2);ctx.stroke();\n ctx.fillStyle='#15956b';ctx.fillText('L',w*.48,y2+30);\n // resistor symbol top\n ctx.strokeStyle='#e98225';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(w*.42,y1);ctx.lineTo(w*.435,y1);for(let k=0;k\u003c6;k++)ctx.lineTo(w*(.44+k*.023),y1+(k%2===0?-8:8));ctx.lineTo(w*.58,y1);ctx.stroke();\n ctx.fillStyle='#e98225';ctx.fillText('R',w*.49,y1-15);\n // moving charge dots and current arrow\n const q=Math.exp(-Math.min(30,p.beta*time))*Math.cos(p.wd*time);\n const n=8, count=Math.round((q+1)*n/2);\n for(let k=0;k\u003cn;k++){ctx.beginPath();ctx.fillStyle=k\u003ccount?'#1677d2':'#d8e3ef';ctx.arc(x1-7+k*2,h*.475,2.8,0,Math.PI*2);ctx.fill();}\n const current=Math.sin(p.wd*time)*Math.exp(-Math.min(30,p.beta*time));\n ctx.strokeStyle=current>=0?'#15956b':'#e98225';ctx.lineWidth=3;ctx.beginPath();let ax=w*.7,ay=h*.5;ctx.moveTo(ax-24*Math.sign(current||1),ay);ctx.lineTo(ax+24*Math.sign(current||1),ay);ctx.stroke();ctx.beginPath();ctx.moveTo(ax+24*Math.sign(current||1),ay);ctx.lineTo(ax+15*Math.sign(current||1),ay-6);ctx.lineTo(ax+15*Math.sign(current||1),ay+6);ctx.closePath();ctx.fillStyle=ctx.strokeStyle;ctx.fill();\n ctx.fillStyle='#334155';ctx.fillText('Kondensator',x1-36,h*.62);ctx.fillText('Tok yo‘nalishi',w*.62,h*.62);\n ctx.fillStyle='#5d6b7b';ctx.fillText('Zaryad va tok vaqt bo‘yicha o‘zgaradi',12,h-9);\n}\nfunction drawEnergy(p){\n const {ctx,w,h}=setup(canvases.energy), maxT=Math.max(.25,Math.min(2.5,p.T*5));\n const a=axes(ctx,w,h,'Energiya',maxT);\n ctx.strokeStyle='#1677d2';ctx.lineWidth=2.2;ctx.beginPath();\n for(let k=0;k\u003c=400;k++){let t=maxT*k/400, q=Math.exp(-Math.min(30,p.beta*t))*Math.cos(p.wd*t),v=q*q,x=a.left+t/maxT*a.pw,y=a.top+a.ph*(1-v);k?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.stroke();\n ctx.strokeStyle='#15956b';ctx.beginPath();\n for(let k=0;k\u003c=400;k++){let t=maxT*k/400, env=Math.exp(-Math.min(30,p.beta*t)),v=env*env*Math.sin(p.wd*t)**2,x=a.left+t/maxT*a.pw,y=a.top+a.ph*(1-v);k?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.stroke();\n ctx.strokeStyle='#e98225';ctx.beginPath();\n for(let k=0;k\u003c=400;k++){let t=maxT*k/400, v=1-Math.exp(-Math.min(30,2*p.beta*t)),x=a.left+t/maxT*a.pw,y=a.top+a.ph*(1-v);k?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.stroke();\n}\nfunction render(){const p=params();drawCircuit(p);drawGraph('charge','q',p);drawGraph('current','i',p);drawEnergy(p);$('tval').textContent=time.toFixed(2)+' s';}\nfunction loop(ts){if(!running)return;if(!last)last=ts;const dt=Math.min(.05,(ts-last)/1000);last=ts;time+=dt;const p=params();if(time>Math.max(1,Math.min(8,p.T*8)))time=0;render();raf=requestAnimationFrame(loop);}\n$('play').addEventListener('click',()=>{if(!running){running=true;last=0;raf=requestAnimationFrame(loop);}});\n$('pause').addEventListener('click',()=>{running=false;cancelAnimationFrame(raf);last=0;});\n$('reset').addEventListener('click',()=>{running=false;cancelAnimationFrame(raf);time=0;last=0;render();});\n[Ls,Cs,Rs].forEach(el=>el.addEventListener('input',()=>render()));\nwindow.addEventListener('resize',render);\nrender();\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>"}, {"t": "Tranzistorli generator", "h": "\u003c!DOCTYPE html>\n\u003chtml lang=\"uz\">\u003chead>\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>Tranzistorli elektromagnit tebranishlar generatori — 3 ta dars rejasi\u003c/title>\n\u003cstyle>\n:root{--bg:#f6f7fb;--card:#fff;--tx:#1b2333;--mu:#5b667a;--ac:#1d6fd8;--ac2:#e8590c;--bd:#d9deea;--ok:#2b8a3e;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#10141c;--card:#1a2030;--tx:#e8ecf5;--mu:#9aa6bd;--ac:#5aa2ff;--ac2:#ff9a5c;--bd:#2e3750;--ok:#6fcf86;color-scheme:dark}}\n:root[data-theme=\"dark\"]{--bg:#10141c;--card:#1a2030;--tx:#e8ecf5;--mu:#9aa6bd;--ac:#5aa2ff;--ac2:#ff9a5c;--bd:#2e3750;--ok:#6fcf86;color-scheme:dark}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif}\nheader{padding:22px 16px 10px;max-width:960px;margin:auto}\nh1{font-size:1.5rem;margin:0 0 4px}h2{font-size:1.25rem;margin:18px 0 8px;color:var(--ac)}h3{font-size:1.05rem;margin:14px 0 6px}\n.sub{color:var(--mu);margin:0}\nnav{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;display:flex;gap:6px;overflow-x:auto;padding:8px 16px;max-width:960px;margin:auto}\nnav button{flex:0 0 auto;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:20px;font:inherit;cursor:pointer}\nnav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}\nmain{max-width:960px;margin:auto;padding:0 16px 40px}\nsection{display:none}section.on{display:block}\n.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:12px 0}\n.f{font-family:Georgia,serif;font-size:1.1rem;color:var(--ac2);font-weight:600}\ntable{border-collapse:collapse;width:100%;font-size:.93rem}\nth,td{border:1px solid var(--bd);padding:6px 8px;text-align:left;vertical-align:top}\nth{background:color-mix(in srgb,var(--ac) 14%,var(--card))}\n.scroll{overflow-x:auto}\ncanvas{width:100%;height:auto;border:1px solid var(--bd);border-radius:10px;background:var(--card);display:block}\n.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 16px;margin:10px 0}\n.ctl label{font-size:.9rem;display:block}.ctl input[type=range]{width:100%}\n.btns{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}\n.btns button,.pr{border:0;background:var(--ac);color:#fff;padding:9px 14px;border-radius:8px;font:inherit;cursor:pointer}\n.btns button.alt{background:var(--ac2)}\n.out{display:flex;gap:10px;flex-wrap:wrap;font-size:.92rem}.out span{background:color-mix(in srgb,var(--ac) 12%,var(--card));padding:4px 10px;border-radius:8px}\n#st{font-weight:600}\ndetails{margin:6px 0}summary{cursor:pointer;color:var(--ac);font-weight:600}\n.tag{display:inline-block;background:var(--ac2);color:#fff;border-radius:6px;padding:1px 8px;font-size:.8rem}\nul{margin:4px 0 4px 18px;padding:0}\n@media print{nav,.btns,.ctl,.pr,#simbox{display:none!important}section{display:block!important;page-break-before:always}section:first-of-type{page-break-before:auto}:root{--bg:#fff;--card:#fff;--tx:#000;--mu:#333;--ac:#0b3d91;--ac2:#a33a00;--bd:#999}details{display:block}details>*{display:block}.card{break-inside:avoid}}\n\u003c/style>\u003c/head>\u003cbody>\n\u003cheader>\u003ch1>⚡ Tranzistorli elektromagnit tebranishlar generatori\u003c/h1>\n\u003cp class=\"sub\">11-sinf fizika · 3 ta dars rejasi (har biri 45 daqiqa) · nazariya · interaktiv simulyatsiya\u003c/p>\n\u003cp>\u003cbutton class=\"pr\" onclick=\"print()\">🖨 Chop etish / PDF\u003c/button>\u003c/p>\u003c/header>\n\u003cnav id=\"nav\">\u003c/nav>\n\u003cmain>\n\u003csection id=\"s0\" class=\"on\">\n\u003ch2>1. Nazariy ma’lumot\u003c/h2>\n\u003cdiv class=\"card\">\u003ch3>Tebranish konturi\u003c/h3>\n\u003cp>Ketma-ket ulangan kondensator (C) va induktivlik gʻaltagidan (L) iborat zanjir \u003cb>tebranish konturi\u003c/b> deyiladi. Zaryadlangan kondensator gʻaltak orqali razryadlanadi: elektr maydon energiyasi magnit maydon energiyasiga, soʻng teskarisiga oʻtadi. Shu tariqa zaryad, kuchlanish va tok davriy oʻzgaradi.\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>Asosiy formulalar\u003c/h3>\u003cdiv class=\"scroll\">\u003ctable>\n\u003ctr>\u003cth>Formula\u003c/th>\u003cth>Izohi\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd class=\"f\">T = 2π√(LC)\u003c/td>\u003ctd>Tomson formulasi: tebranish davri (s). L — induktivlik (H), C — sigʻim (F).\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"f\">ν = 1/(2π√(LC))\u003c/td>\u003ctd>Chastota (Hz): 1 sekundda necha tebranish. ν = 1/T.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"f\">ω = 1/√(LC)\u003c/td>\u003ctd>Siklik (xususiy) chastota (rad/s): ω = 2πν.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"f\">q = q\u003csub>m\u003c/sub> cos ωt\u003c/td>\u003ctd>Kondensator zaryadining oʻzgarishi; q\u003csub>m\u003c/sub> — maksimal zaryad (amplituda).\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"f\">i = −q\u003csub>m\u003c/sub> ω sin ωt\u003c/td>\u003ctd>Tok kuchi zaryaddan vaqt boʻyicha hosila: i = q′. Tok amplitudasi I\u003csub>m\u003c/sub> = q\u003csub>m\u003c/sub>ω. Zaryad maksimal boʻlganda tok nol.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"f\">W = CU²/2 + LI²/2\u003c/td>\u003ctd>Kontur toʻliq energiyasi: elektr maydon + magnit maydon. Idealda W = const.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"f\">I\u003csub>e\u003c/sub> = I\u003csub>b\u003c/sub> + I\u003csub>k\u003c/sub>\u003c/td>\u003ctd>Tranzistorda emitter toki = baza toki + kollektor toki.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"f\">β = I\u003csub>k\u003c/sub>/I\u003csub>b\u003c/sub>\u003c/td>\u003ctd>Tokni kuchaytirish koeffitsiyenti (odatda 20–200).\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"f\">Generatsiya sharti\u003c/td>\u003ctd>Tranzistor bir davrda konturga bergan energiya yoʻqotishdan kam boʻlmasligi kerak: \u003cb>β·M ≥ R·C\u003c/b> (M — teskari aloqa gʻaltagining oʻzaro induksiyasi, R — kontur qarshiligi). Bundan tashqari teskari aloqa \u003cb>musbat\u003c/b> boʻlishi (faza mos kelishi) shart.\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>Tebranishlar nega soʻnadi?\u003c/h3>\u003cul>\u003cli>Simlar va gʻaltakning aktiv qarshiligi R tufayli energiya Joul issiqligiga aylanadi.\u003c/li>\u003cli>Gʻaltak va kondensatordan elektromagnit toʻlqin sifatida energiya tarqaladi (nurlanish).\u003c/li>\u003cli>Gʻaltak oʻzagida va dielektrikda energiya yoʻqoladi.\u003c/li>\u003c/ul>\n\u003cp>Natijada amplituda kamayadi — \u003cb>soʻnuvchi tebranishlar\u003c/b>. Ularni qoʻllab-quvvatlash uchun yoʻqotilgan energiyani tashqi manbadan toʻldirib turish kerak.\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>Avtotebranish va generator\u003c/h3>\n\u003cp>\u003cb>Avtotebranish\u003c/b> — tizimning oʻzi tashqi davriy taʼsirsiz, doimiy manba energiyasi hisobiga saqlanadigan tebranish. Misol: devor soati, elektr qoʻngʻiroq, tranzistorli generator.\u003c/p>\n\u003cul>\u003cli>\u003cb>Kontur (LC)\u003c/b> — chastotani belgilaydi.\u003c/li>\u003cli>\u003cb>Tranzistor\u003c/b> — kalit/kuchaytirgich: manba energiyasini kerakli paytda konturga beradi.\u003c/li>\u003cli>\u003cb>Tok manbai (batareya)\u003c/b> — energiya zaxirasi.\u003c/li>\u003cli>\u003cb>Teskari aloqa\u003c/b> — kontur signalining bir qismini (L\u003csub>aloqa\u003c/sub> gʻaltagi orqali) tranzistor bazasiga qaytaradi, shu bilan tranzistorni toʻgʻri fazada boshqaradi.\u003c/li>\u003c/ul>\n\u003cp>\u003cb>Ishlash prinsipi:\u003c/b> manba ulanganda tok ortadi va konturda kichik tebranish paydo boʻladi → teskari aloqa gʻaltagi bazaga mos kuchlanish beradi → kollektor toki β marta kuchli oʻzgaradi → bu energiya konturni “turtib” amplitudani oshiradi → amplituda shunday qiymatga yetadiki, bir davrda olingan energiya = yoʻqotilgan energiya. Tebranishlar \u003cb>turgʻun\u003c/b> boʻladi.\u003c/p>\n\u003cp>\u003cb>Qoʻllanilishi:\u003c/b> radio va televizor uzatgich/qabulqilgichlari (tashuvchi chastota), signal generatorlari, mobil aloqa, kompyuter soat chastotasi, tibbiy va oʻlchov asboblari.\u003c/p>\u003c/div>\n\n\u003cdiv id=\"simbox\">\u003ch2>2. Simulyatsiya: LC kontur va tranzistorli generator\u003c/h2>\n\u003cdiv class=\"card\">\n\u003cp class=\"sub\">Slayderlarni oʻzgartiring. “Generator” yoqilganda tranzistor soʻnishni qoplaydi — agar generatsiya sharti bajarilsa, tebranish oʻz-oʻzidan paydo boʻladi va turgʻunlashadi.\u003c/p>\n\u003ccanvas id=\"cv\" width=\"640\" height=\"400\">\u003c/canvas>\n\u003cdiv class=\"ctl\">\n\u003clabel>L = \u003cb id=\"vL\">10\u003c/b> mH\u003cinput id=\"L\" type=\"range\" min=\"1\" max=\"100\" value=\"10\">\u003c/label>\n\u003clabel>C = \u003cb id=\"vC\">10\u003c/b> nF\u003cinput id=\"C\" type=\"range\" min=\"1\" max=\"100\" value=\"10\">\u003c/label>\n\u003clabel>Yoʻqotish R (soʻnish) = \u003cb id=\"vR\">4\u003c/b>\u003cinput id=\"R\" type=\"range\" min=\"0\" max=\"20\" value=\"4\">\u003c/label>\n\u003clabel>β (kuchaytirish) = \u003cb id=\"vB\">50\u003c/b>\u003cinput id=\"B\" type=\"range\" min=\"10\" max=\"150\" value=\"50\">\u003c/label>\n\u003clabel>Aloqa M = \u003cb id=\"vM\">5\u003c/b>\u003cinput id=\"M\" type=\"range\" min=\"0\" max=\"20\" value=\"5\">\u003c/label>\u003c/div>\n\u003cdiv class=\"btns\">\u003cbutton id=\"b1\">⚡ Kondensatorni zaryadlash\u003c/button>\u003cbutton id=\"b2\" class=\"alt\">Generator: OʻCHIQ\u003c/button>\u003cbutton id=\"b3\" class=\"alt\">⏸ Pauza\u003c/button>\u003c/div>\n\u003cdiv class=\"out\">\u003cspan>T = \u003cb id=\"oT\">\u003c/b>\u003c/span>\u003cspan>ν = \u003cb id=\"oN\">\u003c/b>\u003c/span>\u003cspan>ω = \u003cb id=\"oW\">\u003c/b>\u003c/span>\u003cspan id=\"st\">\u003c/span>\u003c/div>\n\u003c/div>\u003c/div>\n\u003c/section>\n\u003csection id=\"s1\">\u003c/section>\u003csection id=\"s2\">\u003c/section>\u003csection id=\"s3\">\u003c/section>\n\u003c/main>\n\u003cscript>\n/* ---------- Dars rejalari ma’lumotlari ---------- */\nconst P=[\n{n:\"1-reja · Anʼanaviy (tushuntirish + masala yechish)\",\n mq:[\"Tebranish konturi, soʻnish sababi, avtotebranish va generator tuzilishini tushuntirish.\",\"Tomson formulasi va tranzistor formulalarini masalalarda qoʻllashni oʻrgatish.\",\"Mantiqiy fikrlash va hisoblash koʻnikmasini rivojlantirish.\",\"Texnikaga qiziqish, aniqlik va intizomni tarbiyalash.\"],\n nat:[\"Generator tarkibini sanaydi va ishlash prinsipini bayon qiladi.\",\"T, ν, ω ni hisoblaydi; β va tok kuchlarini topadi.\",\"Generatsiya shartini izohlaydi.\"],\n jih:\"Doska, mel/marker, generator sxemasi plakati, proyektor (slayd), kalkulyator, formulalar jadvali.\",\n st:[[\"0–3\",\"Tashkiliy qism\",\"Salomlashadi, davomatni oladi, mavzuni eʼlon qiladi.\",\"Tayyorlanadi, daftar ochadi.\"],\n [\"3–10\",\"Oʻtgan mavzuni soʻrash\",\"Erkin va majburiy tebranishlar, LC kontur haqida savollar beradi.\",\"Savollarga javob beradi.\"],\n [\"10–25\",\"Yangi mavzu bayoni\",\"Sxemani chizib tushuntiradi: kontur → soʻnish → avtotebranish → generator; formulalarni yozadi.\",\"Tinglaydi, sxemani va formulalarni daftarga koʻchiradi.\"],\n [\"25–35\",\"Masala yechish\",\"Namuna masalani doskada yechadi, 2-masalani oʻquvchiga topshiradi.\",\"Masalani mustaqil yechadi, doskada tekshiradi.\"],\n [\"35–42\",\"Mustahkamlash\",\"3 ta nazorat savolini beradi, testni oʻtkazadi.\",\"Savollarga javob beradi, test belgilaydi.\"],\n [\"42–45\",\"Yakun, baholash, uy vazifasi\",\"Baholarni eʼlon qiladi, vazifani tushuntiradi.\",\"Vazifani yozib oladi.\"]],\n bh:[[\"Nazariy javob (savollar)\",\"0–3 ball\"],[\"Masala yechish\",\"0–5 ball\"],[\"Test\",\"0–2 ball\"],[\"Faollik, daftar\",\"0–1 ball\"]],\n uv:\"Darslikdagi mavzuni oʻqish; sxemani chizib, har bir qismining vazifasini yozish; 2 ta masala (T va ν hisoblash).\",\n sv:[\"Tranzistorli generator qanday qismlardan iborat?\",\"Nima uchun LC konturdagi tebranishlar soʻnadi?\",\"Avtotebranish erkin tebranishdan nimasi bilan farq qiladi?\"],\n ms:[[\"L = 1 mH, C = 100 pF boʻlgan konturda T va ν ni toping.\",\"T = 2π√(LC) = 2·3,14·√(10⁻³·10⁻¹⁰) = 6,28·√10⁻¹³ ≈ 6,28·3,16·10⁻⁷ ≈ 2·10⁻⁶ s = 2 μs. ν = 1/T ≈ 5·10⁵ Hz = 500 kHz.\"],\n [\"β = 50, I\u003csub>b\u003c/sub> = 0,2 mA boʻlsa, I\u003csub>k\u003c/sub> va I\u003csub>e\u003c/sub> ni toping.\",\"I\u003csub>k\u003c/sub> = β·I\u003csub>b\u003c/sub> = 50·0,2 = 10 mA. I\u003csub>e\u003c/sub> = I\u003csub>b\u003c/sub> + I\u003csub>k\u003c/sub> = 0,2 + 10 = 10,2 mA.\"]],\n ts:[\"Generatorda tebranish amplitudasi turgʻun boʻlishi sharti:\",[\"A) manba kuchlanishi ortishi\",\"B) bir davrda olingan energiya = yoʻqotilgan energiya\",\"C) tranzistor oʻchirilishi\",\"D) C = 0\"],\"B\"]},\n{n:\"2-reja · Muammoli-interaktiv (guruh, klaster, mini-test)\",\n mq:[\"Muammoli vaziyatda soʻnmas tebranish hosil qilish yoʻllarini mustaqil topish.\",\"Guruhda klaster tuzib, generator tarkibi va ishlash prinsipini umumlashtirish.\",\"Tanqidiy fikrlash, hamkorlikda ishlash va taqdimot qilish koʻnikmalarini rivojlantirish.\",\"Jamoaviy masʼuliyat va bir-birini tinglash madaniyatini tarbiyalash.\"],\n nat:[\"Soʻnish sababini va uni bartaraf etish yoʻlini asoslaydi.\",\"Klasterda kontur, tranzistor, manba, teskari aloqani bogʻlaydi.\",\"Mini-testda kamida 70% toʻgʻri javob beradi.\"],\n jih:\"Flipchart/A3 qogʻoz, markerlar, rangli stikerlar, guruh topshiriq kartalari, mini-test varaqlari, simulyatsiya (shu sahifa) proyektorda.\",\n st:[[\"0–5\",\"Muammoli savol\",\"“Kontur tebranishi nega toʻxtaydi va uni qanday toʻxtatmaslik mumkin?” — savolini qoʻyadi.\",\"Taxmin qiladi, fikrini bildiradi.\"],\n [\"5–20\",\"Guruhlarda ishlash (4 guruh)\",\"Kartalar beradi: 1) kontur, 2) soʻnish, 3) tranzistor va β, 4) teskari aloqa va generatsiya sharti. Kuzatadi, yordam beradi.\",\"Matnni oʻqiydi, muhokama qiladi, A3 qogʻozga xulosa yozadi.\"],\n [\"20–28\",\"Klaster tuzish\",\"Markazga “Generator” soʻzini yozadi, guruhlarga shoxlar qoʻshtiradi.\",\"Har guruh oʻz shoxini markazga ulaydi, aloqalarni chizadi.\"],\n [\"28–35\",\"Guruh taqdimoti\",\"Qisqa savollar beradi (har guruhga 1,5 daqiqa).\",\"Taqdimot qiladi, boshqa guruhlarga savol beradi.\"],\n [\"35–42\",\"Mini-test (5 savol)\",\"Varaqlarni tarqatadi, vaqtni nazorat qiladi.\",\"Individual yechadi, oʻzaro tekshiradi.\"],\n [\"42–45\",\"Refleksiya, uy vazifasi\",\"“Bugun bildim / qiyin boʻldi / bilmoqchiman” — stikerlarni yigʻadi.\",\"Stiker yopishtiradi, vazifani yozadi.\"]],\n bh:[[\"Guruh ishi va klaster (rubrika)\",\"0–4 ball\"],[\"Taqdimot va savol-javob\",\"0–3 ball\"],[\"Mini-test\",\"0–3 ball (5 savol)\"],[\"Oʻzaro baholash\",\"bonus 1 ball\"]],\n uv:\"Uyda generator sxemasini chizib, teskari aloqaning vazifasini yozma tushuntirish; 2 ta masala; “Radio qanday ishlaydi?” boʻyicha 5 gaplik xulosa.\",\n sv:[\"Teskari aloqa musbat boʻlmasa nima boʻladi?\",\"Generatsiya sharti β·M ≥ R·C nimani anglatadi?\",\"Tranzistor generatorda nima uchun “kalit” deb ataladi?\"],\n ms:[[\"ν = 1 MHz, L = 25,3 μH boʻlsa, C ni toping.\",\"C = 1/(4π²ν²L) = 1/(39,5·10¹²·25,3·10⁻⁶) ≈ 1/(10⁹) = 10⁻⁹ F = 1 nF.\"],\n [\"C = 2 μF, U = 10 V, L = 0,5 mH. Energiya W va maksimal tok I\u003csub>m\u003c/sub> ni toping.\",\"W = CU²/2 = 2·10⁻⁶·100/2 = 10⁻⁴ J = 100 μJ. W = LI²/2 ⇒ I = √(2W/L) = √(2·10⁻⁴/5·10⁻⁴) = √0,4 ≈ 0,63 A.\"]],\n ts:[\"Teskari aloqa generatorda nima vazifani bajaradi?\",[\"A) kontur chastotasini oshiradi\",\"B) manbani zaryadlaydi\",\"C) energiyani konturga toʻgʻri fazada qaytaradi\",\"D) tokni oʻchiradi\"],\"C\"]},\n{n:\"3-reja · Laboratoriya / STEM (sxema yigʻish va simulyatsiya)\",\n mq:[\"Tranzistorli generator sxemasini yigʻish/simulyatsiyada tekshirish, chastotani oʻlchash.\",\"Oʻlchash natijasini T = 2π√(LC) boʻyicha hisobiy qiymat bilan solishtirish.\",\"Eksperiment, tahlil va muhandislik fikrlashni rivojlantirish.\",\"Xavfsizlik qoidalariga rioya qilish, jamoada ishlashni tarbiyalash.\"],\n nat:[\"Generator sxemasini toʻgʻri tuzadi (kontur, tranzistor, manba, aloqa).\",\"L yoki C ni oʻzgartirib, chastota oʻzgarishini asoslaydi.\",\"Laboratoriya hisobotini rasmiylashtiradi.\"],\n jih:\"Real: tranzistor (n-p-n, masalan BC547), gʻaltak, kondensatorlar, rezistor, 9 V batareya, maketli plata, simlar, osillograf yoki chastotomer. Virtual: PhET “Circuit Construction Kit”/“LC kontur” yoki Tinkercad Circuits, kompyuter/planshet.\",\n st:[[\"0–5\",\"Xavfsizlik va maqsad\",\"Texnika xavfsizligini tushuntiradi (polyarlik, qisqa tutashuv). Topshiriq beradi.\",\"Qoidalarni tinglaydi, imzo qoʻyadi.\"],\n [\"5–20\",\"Simulyatsiya (PhET/Tinkercad)\",\"L va C ni oʻzgartirib kuzatishni tashkil qiladi; jadval beradi.\",\"L, C qiymatlarini oʻrnatadi, T ni oʻlchaydi, jadval toʻldiradi.\"],\n [\"20–32\",\"Sxema yigʻish\",\"Sxemani koʻrsatadi; baza–kollektor aloqa gʻaltagini yoʻnaltiradi.\",\"Yigʻadi, ulaydi, osillografda signalni kuzatadi.\"],\n [\"32–39\",\"Tahlil\",\"Hisobiy va oʻlchangan T ni solishtirishni soʻraydi, xatoliklarni muhokama qiladi.\",\"Xatolikni (%) hisoblaydi, xulosa yozadi.\"],\n [\"39–43\",\"Hisobot va masala\",\"Masalani topshiradi, hisobotni tekshiradi.\",\"Masalani yechadi, hisobotni topshiradi.\"],\n [\"43–45\",\"Yakun, uy vazifasi\",\"Baholaydi, jihozni joyiga qoʻydirishni nazorat qiladi.\",\"Ish oʻrnini yigʻishtiradi.\"]],\n bh:[[\"Xavfsizlik va tartib\",\"0–1 ball\"],[\"Sxema/simulyatsiya toʻgʻriligi\",\"0–3 ball\"],[\"Oʻlchash va tahlil\",\"0–3 ball\"],[\"Hisobot va masala\",\"0–3 ball\"]],\n uv:\"Laboratoriya hisobotini tugatish (maqsad, sxema, jadval, xulosa); 1 ta ijodiy topshiriq: oddiy radiouzatgich g‘oyasini bayon qilish.\",\n sv:[\"Konturdagi C ni 4 marta oshirsak, T necha marta oʻzgaradi?\",\"Nima uchun sxemada tok manbai kerak?\",\"Oʻlchangan va hisobiy davr nega bir oz farq qiladi?\"],\n ms:[[\"C = 400 pF, ν = 800 kHz boʻlsa, L ni toping.\",\"L = 1/(4π²ν²C) = 1/(39,5·6,4·10¹¹·4·10⁻¹⁰) ≈ 1/(1,01·10⁴) ≈ 9,9·10⁻⁵ H ≈ 99 μH.\"],\n [\"q\u003csub>m\u003c/sub> = 4 μC, ω = 10⁴ rad/s. I\u003csub>m\u003c/sub> va T ni toping.\",\"I\u003csub>m\u003c/sub> = q\u003csub>m\u003c/sub>ω = 4·10⁻⁶·10⁴ = 0,04 A = 40 mA. T = 2π/ω = 6,28/10⁴ ≈ 6,3·10⁻⁴ s = 628 μs.\"]],\n ts:[\"C ni 4 marta orttirsak, tebranish davri:\",[\"A) 4 marta ortadi\",\"B) 2 marta ortadi\",\"C) 2 marta kamayadi\",\"D) oʻzgarmaydi\"],\"B\"]}\n];\nconst li=a=>\"\u003cul>\"+a.map(x=>\"\u003cli>\"+x+\"\u003c/li>\").join(\"\")+\"\u003c/ul>\";\nfunction plan(p,i){return `\u003ch2>${p.n}\u003c/h2>\n\u003cdiv class=\"card\">\u003ch3>Dars maqsadi\u003c/h3>\u003cul>\u003cli>\u003cb>Taʼlimiy:\u003c/b> ${p.mq[0]}\u003c/li>\u003cli>\u003cb>Taʼlimiy:\u003c/b> ${p.mq[1]}\u003c/li>\u003cli>\u003cb>Rivojlantiruvchi:\u003c/b> ${p.mq[2]}\u003c/li>\u003cli>\u003cb>Tarbiyaviy:\u003c/b> ${p.mq[3]}\u003c/li>\u003c/ul>\n\u003ch3>Kutilayotgan natijalar\u003c/h3>${li(p.nat)}\u003ch3>Jihozlar\u003c/h3>\u003cp>${p.jih}\u003c/p>\u003cp>\u003cspan class=\"tag\">Davomiyligi: 45 daqiqa\u003c/span>\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>Dars bosqichlari\u003c/h3>\u003cdiv class=\"scroll\">\u003ctable>\u003ctr>\u003cth>Vaqt (daq.)\u003c/th>\u003cth>Bosqich\u003c/th>\u003cth>Oʻqituvchi faoliyati\u003c/th>\u003cth>Oʻquvchi faoliyati\u003c/th>\u003c/tr>${p.st.map(r=>\"\u003ctr>\"+r.map(c=>\"\u003ctd>\"+c+\"\u003c/td>\").join(\"\")+\"\u003c/tr>\").join(\"\")}\u003c/table>\u003c/div>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>Baholash mezonlari (jami 10 ball)\u003c/h3>\u003cdiv class=\"scroll\">\u003ctable>\u003ctr>\u003cth>Mezon\u003c/th>\u003cth>Ball\u003c/th>\u003c/tr>${p.bh.map(r=>`\u003ctr>\u003ctd>${r[0]}\u003c/td>\u003ctd>${r[1]}\u003c/td>\u003c/tr>`).join(\"\")}\u003c/table>\u003c/div>\u003cp class=\"sub\">9–10 ball — “5”; 7–8 — “4”; 5–6 — “3”; 5 dan kam — “2”.\u003c/p>\n\u003ch3>Uy vazifasi\u003c/h3>\u003cp>${p.uv}\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>3 ta nazorat savoli\u003c/h3>\u003col>${p.sv.map(x=>\"\u003cli>\"+x+\"\u003c/li>\").join(\"\")}\u003c/ol>\n\u003ch3>2 ta hisoblash masalasi\u003c/h3>${p.ms.map((m,k)=>`\u003cp>\u003cb>${k+1}-masala.\u003c/b> ${m[0]}\u003c/p>\u003cdetails open>\u003csummary>Yechimi\u003c/summary>\u003cp>${m[1]}\u003c/p>\u003c/details>`).join(\"\")}\n\u003ch3>Test\u003c/h3>\u003cp>${p.ts[0]}\u003c/p>\u003cul style=\"list-style:none;margin-left:0\">${p.ts[1].map(x=>\"\u003cli>\"+x+\"\u003c/li>\").join(\"\")}\u003c/ul>\u003cp>\u003cb>Toʻgʻri javob: ${p.ts[2]}\u003c/b>\u003c/p>\u003c/div>`}\nP.forEach((p,i)=>document.getElementById(\"s\"+(i+1)).innerHTML=plan(p,i));\n/* ---------- Navigatsiya ---------- */\nconst names=[\"📘 Nazariya + simulyatsiya\",\"1-reja: Anʼanaviy\",\"2-reja: Interaktiv\",\"3-reja: STEM\"];\nconst nav=document.getElementById(\"nav\");\nnames.forEach((t,i)=>{const b=document.createElement(\"button\");b.textContent=t;b.onclick=()=>show(i);nav.appendChild(b)});\nfunction show(k){[...nav.children].forEach((b,i)=>b.classList.toggle(\"on\",i==k));for(let i=0;i\u003c4;i++)document.getElementById(\"s\"+i).classList.toggle(\"on\",i==k);scrollTo(0,0)}\nshow(0);\n/* ---------- Simulyatsiya ---------- */\nconst $=id=>document.getElementById(id),cv=$(\"cv\"),g=cv.getContext(\"2d\");\nlet x=1,v=0,gen=false,paused=false,hist=[],ph=0,last=performance.now();\n[\"L\",\"C\",\"R\",\"B\",\"M\"].forEach(k=>$(k).oninput=upd);\n$(\"b1\").onclick=()=>{x=1;v=0;hist=[]};\n$(\"b2\").onclick=()=>{gen=!gen;$(\"b2\").textContent=\"Generator: \"+(gen?\"YOQIQ\":\"OʻCHIQ\");if(gen&&Math.abs(x)\u003c.05)x=.05};\n$(\"b3\").onclick=()=>{paused=!paused;$(\"b3\").textContent=paused?\"▶ Davom\":\"⏸ Pauza\"};\nconst fmt=(t,u)=>{const a=[[\"\",1],[\"m\",1e-3],[\"μ\",1e-6],[\"n\",1e-9]];for(const[p,s]of a)if(t>=s)return(t/s).toFixed(2)+\" \"+p+u;return t.toExponential(1)+\" \"+u};\nfunction par(){const L=$(\"L\").value*1e-3,C=$(\"C\").value*1e-9,w=1/Math.sqrt(L*C);\n return{L,C,w,k:$(\"B\").value*$(\"M\").value*3e-5,z:$(\"R\").value*.004}}\nfunction upd(){[\"L\",\"C\",\"R\",\"B\",\"M\"].forEach(k=>$(\"v\"+k).textContent=$(k).value);\n const p=par(),T=2*Math.PI/p.w;$(\"oT\").textContent=fmt(T,\"s\");$(\"oN\").textContent=fmt(1/T,\"Hz\");$(\"oW\").textContent=(p.w).toExponential(2)+\" rad/s\";\n const ok=gen&&p.k>p.z;$(\"st\").textContent=!gen?\"Generator oʻchiq: tebranish soʻnadi\":ok?\"✔ Generatsiya sharti bajarildi (β·M > R)\":\"✖ Shart bajarilmadi (β·M \u003c R): soʻnadi\";$(\"st\").style.color=ok?\"var(--ok)\":\"var(--ac2)\"}\nupd();setInterval(upd,300);\nfunction css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}\nfunction frame(now){const dt=Math.min(.05,(now-last)/1e3);last=now;const p=par();\n if(!paused){const wv=3.2*Math.pow(p.w/1e5,.5),steps=40,h=dt*wv/steps,k=gen?p.k:0,kk=gen?p.k:0;\n  for(let i=0;i\u003csteps;i++){const a=-x-2*p.z*v+2*kk*v*(1-x*x);v+=a*h;x+=v*h}\n  ph+=dt;hist.push(x);if(hist.length>300)hist.shift()}\n draw(p);requestAnimationFrame(frame)}\nfunction draw(p){const W=640,H=400,tx=css(\"--tx\"),ac=css(\"--ac\"),a2=css(\"--ac2\"),mu=css(\"--mu\"),bd=css(\"--bd\");\n g.clearRect(0,0,W,H);g.lineWidth=2;g.strokeStyle=tx;g.fillStyle=tx;g.font=\"13px system-ui\";\n const q=Math.max(-1,Math.min(1,x/1.2)),I=Math.max(-1,Math.min(1,v/1.2));\n // kontur sxemasi\n g.strokeRect(70,40,240,110);g.clearRect(150,30,80,20);g.clearRect(150,140,80,20);g.clearRect(62,70,16,50);\n // kondensator (chap)\n g.fillStyle=css(\"--card\");g.fillRect(60,75,20,40);g.fillStyle=tx;\n g.fillRect(55,88,30,3);g.fillRect(55,99,30,3);\n g.fillStyle=q>0?a2:ac;g.globalAlpha=Math.abs(q);g.fillRect(56,86,28,5);g.globalAlpha=1;\n g.fillStyle=q>0?ac:a2;g.globalAlpha=Math.abs(q);g.fillRect(56,99,28,5);g.globalAlpha=1;g.fillStyle=tx;\n g.fillText(\"C\",42,100);\n // gʻaltak (yuqorida)\n g.beginPath();for(let i=0;i\u003c5;i++)g.arc(170+i*14,40,7,Math.PI,0);g.stroke();g.fillText(\"L\",196,24);\n // tok zarralari\n const n=14,per=2*(240+110);g.fillStyle=a2;\n for(let i=0;i\u003cn;i++){let s=((i/n)*per+ -I*0+ (ph*0))%per;s=(s+ (I>0?1:-1)*(window.__o=(window.__o||0)+0))%per}\n window.__o=(window.__o||0)+I*3;\n for(let i=0;i\u003cn;i++){let s=(((i/n)*per+window.__o)%per+per)%per,X,Y;\n  if(s\u003c240){X=70+s;Y=40}else if(s\u003c350){X=310;Y=40+(s-240)}else if(s\u003c590){X=310-(s-350);Y=150}else{X=70;Y=150-(s-590)}\n  g.globalAlpha=Math.min(1,.25+Math.abs(I));g.beginPath();g.arc(X,Y,3.2,0,6.3);g.fill()}\n g.globalAlpha=1;\n // tranzistor bloki\n g.strokeStyle=gen?ac:mu;g.setLineDash(gen?[]:[4,4]);g.strokeRect(350,40,120,110);g.setLineDash([]);\n g.fillStyle=gen?ac:mu;g.fillText(\"Tranzistor + manba\",358,60);g.fillText(\"teskari aloqa\",368,140);\n g.beginPath();g.arc(410,95,20,0,6.3);g.stroke();g.beginPath();g.moveTo(400,80);g.lineTo(400,110);g.moveTo(400,90);g.lineTo(418,80);g.moveTo(400,100);g.lineTo(418,110);g.stroke();\n g.strokeStyle=gen?a2:mu;g.setLineDash([5,4]);g.beginPath();g.moveTo(310,95);g.lineTo(380,95);g.stroke();g.setLineDash([]);\n g.fillStyle=mu;g.fillText(\"amplituda: \"+Math.abs(x).toFixed(2),500,60);\n // energiya\n const E=x*x/2,Mg=v*v/2,tot=E+Mg||1e-9,bw=120;g.fillStyle=ac;g.fillRect(500,80,Math.min(bw,E*bw/1.1),14);g.fillStyle=a2;g.fillRect(500,115,Math.min(bw,Mg*bw/1.1),14);\n g.fillStyle=tx;g.fillText(\"CU²/2\",500,76);g.fillText(\"LI²/2\",500,111);\n // grafik\n g.strokeStyle=bd;g.strokeRect(10,175,620,215);g.beginPath();g.moveTo(10,282);g.lineTo(630,282);g.stroke();\n g.fillStyle=mu;g.fillText(\"q(t) — kondensator zaryadi\",18,192);g.fillText(\"t →\",604,276);\n g.strokeStyle=ac;g.lineWidth=2;g.beginPath();hist.forEach((y,i)=>{const X=10+i*620/300,Y=282-Math.max(-1.6,Math.min(1.6,y))*60;i?g.lineTo(X,Y):g.moveTo(X,Y)});g.stroke();g.lineWidth=2}\nrequestAnimationFrame(frame);\n\u003c/script>\u003c/body>\u003c/html>\n"}, {"t": "Elektromagnit tebranishlar", "h": "\u003c!DOCTYPE html>\n\u003chtml lang=\"uz\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>11-sinf fizika — Elektromagnit tebranishlar\u003c/title>\n\u003cstyle>\n:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#5b667a;--blue:#2563eb;--cyan:#0891b2;--orange:#f59e0b;--line:#dbe3ef;--green:#15803d}\n*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,Segoe UI,Arial,sans-serif}\nheader{background:linear-gradient(120deg,#102a56,#176b87);color:#fff;padding:28px 18px}header .wrap,main{max-width:1050px;margin:auto}h1{font-size:clamp(1.65rem,4vw,2.6rem);line-height:1.15;margin:8px 0 12px}header p{max-width:800px;color:#e3f4ff;margin:0}\nmain{padding:18px 14px 42px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 5px 18px #17365d0b}\nh2{font-size:1.35rem;margin:0 0 12px}h3{font-size:1.05rem;margin:14px 0 7px}.sub{color:var(--muted);font-size:.93rem}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.metric{padding:10px;border:1px solid var(--line);border-radius:10px}.metric small{display:block;color:var(--muted)}.metric strong{font-size:1.12rem}\nbutton{font:inherit;border:1px solid var(--line);border-radius:9px;padding:9px 14px;background:var(--card);color:var(--ink);cursor:pointer}button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}button:hover{filter:brightness(.97)}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}\nlabel{display:flex;justify-content:space-between;gap:12px;font-weight:600;margin:12px 0 3px}input[type=range]{width:100%;accent-color:var(--blue)}canvas{width:100%;height:230px;display:block;border:1px solid var(--line);border-radius:10px;background:var(--card)}\n.formula{background:#eef5ff;border-left:4px solid var(--blue);padding:10px 13px;border-radius:8px;margin:8px 0;font-family:Georgia,serif;font-size:1.06rem;overflow-wrap:anywhere}\n.note{background:#fff8e7;border:1px solid #f4d58a;padding:12px;border-radius:10px}.good{background:#ecfdf3;border:1px solid #a7e3bb;padding:12px;border-radius:10px}\ntable{border-collapse:collapse;width:100%;margin:10px 0}th,td{padding:9px;border:1px solid var(--line);text-align:left;vertical-align:top}th{background:#eef3fa}\ndetails{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}summary{font-weight:650;cursor:pointer}.pill{display:inline-block;border-radius:99px;background:#e5efff;color:#1748a3;padding:3px 9px;font-size:.82rem}\nsvg{max-width:100%}.circuit{width:100%;height:auto;max-height:250px}.footer{text-align:center;color:var(--muted);font-size:.9rem;padding:14px}\n@media(max-width:700px){.grid{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr 1fr}.card{padding:14px}canvas{height:210px}table{font-size:.9rem}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cheader>\u003cdiv class=\"wrap\">\n\u003cspan class=\"pill\">11-sinf fizika · Interaktiv HTML5 dars\u003c/span>\n\u003ch1>Tebranishlarni grafik ravishda tasvirlash va so‘nuvchi elektromagnit tebranishlar\u003c/h1>\n\u003cp>Animatsiya, grafik va sozlanadigan parametrlar yordamida tebranish konturida zaryad, tok, energiya hamda amplituda qanday o‘zgarishini o‘rganing.\u003c/p>\n\u003c/div>\u003c/header>\n\u003cmain>\n\u003csection class=\"card\">\n\u003ch2>1. Tebranish konturi — animatsiya\u003c/h2>\n\u003cp class=\"sub\">Kondensator elektr maydon energiyasini, induktiv g‘altak esa magnit maydon energiyasini saqlaydi. Ular orasida energiya almashinishi elektromagnit tebranishlarni yuzaga keltiradi.\u003c/p>\n\u003csvg class=\"circuit\" viewBox=\"0 0 680 245\" role=\"img\" aria-label=\"Kondensator va induktiv g‘altakdan iborat tebranish konturi\">\n\u003cdefs>\u003clinearGradient id=\"plate\" x1=\"0\" x2=\"1\">\u003cstop stop-color=\"#60a5fa\"/>\u003cstop offset=\"1\" stop-color=\"#2563eb\"/>\u003c/linearGradient>\u003c/defs>\n\u003cpath d=\"M125 55 H265 M385 55 H550 V190 H125 V105\" fill=\"none\" stroke=\"#475569\" stroke-width=\"4\" stroke-linecap=\"round\"/>\n\u003cpath d=\"M125 55 V78 M94 78 H156 M94 91 H156 M125 91 V105\" stroke=\"url(#plate)\" stroke-width=\"6\" stroke-linecap=\"round\"/>\n\u003cpath d=\"M265 55 C265 20 295 20 295 55 C295 90 325 90 325 55 C325 20 355 20 355 55 C355 90 385 90 385 55\" fill=\"none\" stroke=\"#0891b2\" stroke-width=\"5\"/>\n\u003cg font-size=\"17\" fill=\"currentColor\">\u003ctext x=\"125\" y=\"25\" text-anchor=\"middle\">Kondensator C\u003c/text>\u003ctext x=\"325\" y=\"112\" text-anchor=\"middle\">Induktiv g‘altak L\u003c/text>\u003ctext x=\"565\" y=\"128\">R\u003c/text>\u003c/g>\n\u003cpath d=\"M510 190 H435\" stroke=\"#f59e0b\" stroke-width=\"5\" stroke-linecap=\"round\"/>\u003cpath d=\"M448 179 L435 190 L448 201\" fill=\"none\" stroke=\"#f59e0b\" stroke-width=\"4\"/>\n\u003ctext x=\"470\" y=\"176\" fill=\"#d97706\" font-size=\"17\">I(t)\u003c/text>\n\u003cg id=\"fieldLines\" opacity=\".75\" stroke=\"#60a5fa\" stroke-width=\"2\">\u003cpath d=\"M75 72 Q55 85 75 99\"/>\u003cpath d=\"M175 72 Q195 85 175 99\"/>\u003cpath d=\"M75 82 Q65 85 75 92\"/>\u003cpath d=\"M175 82 Q185 85 175 92\"/>\u003c/g>\n\u003ctext x=\"340\" y=\"226\" text-anchor=\"middle\" font-size=\"15\" fill=\"currentColor\">Zaryad kamayadi → tok ortadi → energiya g‘altak magnit maydoniga o‘tadi\u003c/text>\n\u003c/svg>\n\u003cdiv class=\"metrics\">\n\u003cdiv class=\"metric\">\u003csmall>Zaryad q / qₘ\u003c/small>\u003cstrong id=\"qval\">+100%\u003c/strong>\u003c/div>\n\u003cdiv class=\"metric\">\u003csmall>Tok i / iₘ (nisbiy)\u003c/small>\u003cstrong id=\"ival\">0%\u003c/strong>\u003c/div>\n\u003cdiv class=\"metric\">\u003csmall>Energiya ustun turi\u003c/small>\u003cstrong id=\"energy\">Elektr\u003c/strong>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"controls\">\u003cbutton id=\"play\" class=\"primary\">⏸ Pauza\u003c/button>\u003cbutton id=\"reset\">↺ Boshidan\u003c/button>\u003cbutton id=\"step\">⏭ ¼ davr oldinga\u003c/button>\u003c/div>\n\u003cp class=\"sub\">Animatsiya nuqtasi zaryadning vaqt bo‘yicha holatini ko‘rsatadi. Model o‘quv maqsadida soddalashtirilgan.\u003c/p>\n\u003c/section>\n\n\u003csection class=\"card\">\n\u003ch2>2. Grafik laboratoriya\u003c/h2>\n\u003cp>Ko‘k chiziq — zaryad q(t). To‘q sariq chiziq — tokning nisbiy o‘zgarishi. Kulrang punktirlar — zaryad amplitudasining so‘nuvchi chegaralari.\u003c/p>\n\u003ccanvas id=\"graph\" aria-label=\"Zaryad va tokning vaqtga bog‘liqlik grafigi\">\u003c/canvas>\n\u003cdiv class=\"grid\">\n\u003cdiv>\n\u003clabel for=\"R\">Qarshilik R \u003coutput id=\"Rv\">10 Ω\u003c/output>\u003c/label>\u003cinput id=\"R\" type=\"range\" min=\"0\" max=\"40\" value=\"10\" step=\"1\">\n\u003clabel for=\"L\">Induktivlik L \u003coutput id=\"Lv\">100 mH\u003c/output>\u003c/label>\u003cinput id=\"L\" type=\"range\" min=\"20\" max=\"200\" value=\"100\" step=\"10\">\n\u003clabel for=\"C\">Sig‘im C \u003coutput id=\"Cv\">100 µF\u003c/output>\u003c/label>\u003cinput id=\"C\" type=\"range\" min=\"20\" max=\"200\" value=\"100\" step=\"10\">\n\u003c/div>\n\u003cdiv>\n\u003cdiv class=\"metric\">\u003csmall>Ideal davr T₀\u003c/small>\u003cstrong id=\"Tval\">19.87 ms\u003c/strong>\u003c/div>\u003cbr>\n\u003cdiv class=\"metric\">\u003csmall>Ideal chastota ν₀\u003c/small>\u003cstrong id=\"Fval\">50.33 Hz\u003c/strong>\u003c/div>\u003cbr>\n\u003cdiv class=\"metric\">\u003csmall>So‘nish koeffitsiyenti β = R/(2L)\u003c/small>\u003cstrong id=\"Bval\">50 s⁻¹\u003c/strong>\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003cdiv id=\"status\" class=\"note\" style=\"margin-top:12px\">Qarshilik energiya yo‘qotilishiga olib keladi.\u003c/div>\n\u003c/section>\n\n\u003csection class=\"card\">\n\u003ch2>3. Nazariy eslatma va formulalar\u003c/h2>\n\u003ch3>Elektromagnit tebranishlar\u003c/h3>\n\u003cp>Kondensator zaryadining va zanjirdagi tokning vaqt davomida davriy o‘zgarishi elektromagnit tebranish deyiladi. Ideal LC konturda energiya kondensatorning elektr maydoni va g‘altakning magnit maydoni orasida almashinadi.\u003c/p>\n\u003cdiv class=\"formula\">q(t) = qₘ cos(ω₀t + φ₀)\u003c/div>\n\u003cp>\u003cb>q\u003c/b> — zaryad (C); \u003cb>qₘ\u003c/b> — zaryad amplitudasi (C); \u003cb>ω₀\u003c/b> — burchak chastota (rad/s); \u003cb>t\u003c/b> — vaqt (s); \u003cb>φ₀\u003c/b> — boshlang‘ich faza (rad).\u003c/p>\n\u003cdiv class=\"formula\">i(t) = dq/dt = −ω₀qₘ sin(ω₀t + φ₀)\u003c/div>\n\u003cp>Tok kuchi zaryadning vaqt bo‘yicha o‘zgarish tezligidir. Tok birligi amper (A). Kosinus ifodaning hosilasi olingani uchun tok sinusga o‘xshash va fazasi zaryadnikidan siljigan bo‘ladi.\u003c/p>\n\u003cdiv class=\"formula\">T₀ = 2π√(LC) &nbsp; · &nbsp; ν₀ = 1/T₀ &nbsp; · &nbsp; ω₀ = 2πν₀ = 1/√(LC)\u003c/div>\n\u003cp>\u003cb>L\u003c/b> — induktivlik (H), \u003cb>C\u003c/b> — sig‘im (F), \u003cb>T\u003c/b> — davr (s), \u003cb>ν\u003c/b> — chastota (Hz). Bu formulalar ideal LC kontur yoki qarshiligi juda kichik kontur uchun qo‘llanadi.\u003c/p>\n\u003ch3>So‘nuvchi tebranishlar\u003c/h3>\n\u003cdiv class=\"formula\">q(t) = qₘ e\u003csup>−βt\u003c/sup> cos(ω\u003csub>d\u003c/sub>t + φ₀)\u003c/div>\n\u003cdiv class=\"formula\">β = R/(2L), &nbsp; ω\u003csub>d\u003c/sub> = √(ω₀² − β²)\u003c/div>\n\u003cp>Qarshilik tufayli elektr energiyasining bir qismi issiqlikka aylanadi. Shu sababli amplituda vaqt o‘tishi bilan kamayadi. Yuqoridagi tebranuvchi yechim \u003cb>β &lt; ω₀\u003c/b> bo‘lgan, ya’ni so‘nuvchi tebranish saqlanadigan ketma-ket RLC kontur holatiga tegishli.\u003c/p>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>Ideal tebranish\u003c/th>\u003cth>So‘nuvchi tebranish\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>Amplituda o‘zgarmaydi.\u003c/td>\u003ctd>Amplituda kamayadi.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Energiya yo‘qotilishi hisobga olinmaydi.\u003c/td>\u003ctd>Energiya qarshilikda issiqlikka aylanadi.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>T₀ = 2π√(LC)\u003c/td>\u003ctd>ωd = √(ω₀² − β²), T_d = 2π/ωd\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003ch3>Amaliy ahamiyati\u003c/h3>\n\u003cul>\u003cli>Radioelektronika va aloqa qurilmalarida rezonansli konturlarni tahlil qilish.\u003c/li>\u003cli>Elektr zanjiridagi o‘tkinchi jarayonlarni o‘rganish.\u003c/li>\u003cli>Filtrlar, generatorlar va impulsli elektron qurilmalarni loyihalash.\u003c/li>\u003c/ul>\n\u003c/section>\n\n\u003csection class=\"card\">\n\u003ch2>4. Bilimingizni tekshiring\u003c/h2>\n\u003cdetails>\u003csummary>1. Kondensator qanday energiyani saqlaydi?\u003c/summary>\u003cp>Elektr maydon energiyasini.\u003c/p>\u003c/details>\n\u003cdetails>\u003csummary>2. Induktiv g‘altakda qanday energiya saqlanadi?\u003c/summary>\u003cp>Magnit maydon energiyasi.\u003c/p>\u003c/details>\n\u003cdetails>\u003csummary>3. Qarshilik nima uchun amplitudani kamaytiradi?\u003c/summary>\u003cp>Elektr energiyasining bir qismi issiqlikka aylanadi.\u003c/p>\u003c/details>\n\u003cdetails>\u003csummary>4. Chastota qanday topiladi?\u003c/summary>\u003cp>ν = 1/T.\u003c/p>\u003c/details>\n\u003cdetails>\u003csummary>5. Grafikning gorizontal o‘qida nima bo‘ladi?\u003c/summary>\u003cp>Vaqt t (sekundlarda).\u003c/p>\u003c/details>\n\u003ch3>Testlar\u003c/h3>\n\u003cdiv class=\"quiz\" data-answer=\"b\">\u003cp>\u003cb>1.\u003c/b> Ideal LC kontur davri qaysi formula bilan topiladi?\u003c/p>\u003clabel>\u003cinput type=\"radio\" name=\"t1\" value=\"a\"> T = LC\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"t1\" value=\"b\"> T = 2π√(LC)\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"t1\" value=\"c\"> T = R/L\u003c/label>\u003c/div>\n\u003cdiv class=\"quiz\" data-answer=\"c\">\u003cp>\u003cb>2.\u003c/b> So‘nishning asosiy sababi nima?\u003c/p>\u003clabel>\u003cinput type=\"radio\" name=\"t2\" value=\"a\"> Zaryadning ko‘payishi\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"t2\" value=\"b\"> Chastotaning doimiyligi\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"t2\" value=\"c\"> Qarshilikda energiyaning issiqlikka aylanishi\u003c/label>\u003c/div>\n\u003cdiv class=\"quiz\" data-answer=\"a\">\u003cp>\u003cb>3.\u003c/b> Chastotaning SI birligi qaysi?\u003c/p>\u003clabel>\u003cinput type=\"radio\" name=\"t3\" value=\"a\"> Gerts (Hz)\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"t3\" value=\"b\"> Om (Ω)\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"t3\" value=\"c\"> Farad (F)\u003c/label>\u003c/div>\n\u003cbutton id=\"check\" class=\"primary\">Javoblarni tekshirish\u003c/button> \u003cstrong id=\"result\" aria-live=\"polite\">\u003c/strong>\n\u003c/section>\n\u003csection class=\"card\">\n\u003ch2>5. Namunaviy masala\u003c/h2>\n\u003cp>\u003cb>Berilgan:\u003c/b> L = 0,1 H, C = 100 µF = 0,0001 F. Ideal kontur davri va chastotasini toping.\u003c/p>\n\u003cdetails>\u003csummary>Yechimini ko‘rsatish\u003c/summary>\n\u003cp>\u003cb>1-qadam.\u003c/b> Formulani yozamiz: T = 2π√(LC).\u003c/p>\n\u003cp>\u003cb>2-qadam.\u003c/b> Qiymatlarni qo‘yamiz: T = 2π√(0,1 × 0,0001) = 2π√0,00001.\u003c/p>\n\u003cp>\u003cb>3-qadam.\u003c/b> Hisoblaymiz: T ≈ 0,0199 s = 19,9 ms.\u003c/p>\n\u003cp>\u003cb>4-qadam.\u003c/b> Chastota: ν = 1/T ≈ 1/0,0199 ≈ 50,3 Hz.\u003c/p>\n\u003cdiv class=\"good\">\u003cb>Javob:\u003c/b> T ≈ 19,9 ms; ν ≈ 50,3 Hz.\u003c/div>\n\u003c/details>\n\u003c/section>\n\u003cp class=\"footer\">HTML5 interaktiv o‘quv materiali · Internet talab qilmaydi · Telefon va kompyuterda ishlaydi\u003c/p>\n\u003c/main>\n\u003cscript>\n(function(){\nconst $=id=>document.getElementById(id),canvas=$('graph'),ctx=canvas.getContext('2d');\nlet running=true,time=0,last=0,raf=0;\nfunction p(){let R=+$('R').value,L=+$('L').value/1000,C=+$('C').value/1e6,w0=1/Math.sqrt(L*C),beta=R/(2*L),wd=Math.sqrt(Math.max(0,w0*w0-beta*beta));return {R,L,C,w0,beta,wd,T:2*Math.PI/w0,f:w0/(2*Math.PI),under:beta\u003cw0}}\nfunction q(t){let a=p();return Math.exp(-a.beta*t)*Math.cos(a.wd*t)}\nfunction update(){let a=p();$('Rv').textContent=a.R+' Ω';$('Lv').textContent=$('L').value+' mH';$('Cv').textContent=$('C').value+' µF';$('Tval').textContent=(a.T*1000).toFixed(2)+' ms';$('Fval').textContent=a.f.toFixed(2)+' Hz';$('Bval').textContent=a.beta.toFixed(1)+' s⁻¹';$('status').textContent=a.R===0?'Ideal holat: energiya yo‘qotilishi hisobga olinmaydi, amplituda o‘zgarmaydi.':a.under?'So‘nuvchi tebranish: qarshilik sabab amplituda kamayadi.':'Katta qarshilikda tebranish kuzatilmasligi, zaryad aperiodik kamayishi mumkin.';draw()}\nfunction draw(){\nlet rect=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2),w=Math.max(300,rect.width),h=230;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);\nlet dark=matchMedia('(prefers-color-scheme: dark)').matches,fg=dark?'#e5e7eb':'#334155',grid=dark?'#374151':'#e2e8f0',left=43,right=12,top=16,bottom=28,gw=w-left-right,gh=h-top-bottom,mid=top+gh/2,a=p(),span=5*a.T;\nctx.strokeStyle=grid;ctx.lineWidth=1;for(let j=0;j\u003c=4;j++){let y=top+gh*j/4;ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(w-right,y);ctx.stroke()}\nctx.strokeStyle=fg;ctx.beginPath();ctx.moveTo(left,top);ctx.lineTo(left,h-bottom);ctx.lineTo(w-right,h-bottom);ctx.stroke();ctx.fillStyle=fg;ctx.font='12px system-ui';ctx.fillText('q/qₘ, i/iₘ',4,12);ctx.fillText('0',22,mid+4);ctx.fillText('vaqt t →',w-72,h-7);\nfunction xx(t){return left+gw*t/span}function yy(v){return mid-v*gh*.43}\nctx.setLineDash([4,4]);ctx.strokeStyle='#94a3b8';for(let s of [-1,1]){ctx.beginPath();for(let j=0;j\u003c=300;j++){let t=j/300*span,y=yy(s*Math.exp(-a.beta*t));j?ctx.lineTo(xx(t),y):ctx.moveTo(xx(t),y)}ctx.stroke()}ctx.setLineDash([]);\nctx.lineWidth=2.5;ctx.strokeStyle='#2563eb';ctx.beginPath();for(let j=0;j\u003c=500;j++){let t=j/500*span,y=yy(q(t));j?ctx.lineTo(xx(t),y):ctx.moveTo(xx(t),y)}ctx.stroke();\nctx.strokeStyle='#f59e0b';ctx.lineWidth=1.7;ctx.beginPath();for(let j=0;j\u003c=500;j++){let t=j/500*span,v=a.under?-Math.exp(-a.beta*t)*a.wd/Math.max(a.w0,1)*Math.sin(a.wd*t):0,y=yy(v);j?ctx.lineTo(xx(t),y):ctx.moveTo(xx(t),y)}ctx.stroke();\nlet now=((time%span)+span)%span,x=xx(now),y=yy(q(now));ctx.fillStyle='#2563eb';ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fill();\nlet v=a.under?-Math.exp(-a.beta*time)*a.wd/Math.max(a.w0,1)*Math.sin(a.wd*time):0;$('qval').textContent=(q(time)>=0?'+':'')+Math.round(q(time)*100)+'%';$('ival').textContent=(v>=0?'+':'')+Math.round(v*100)+'%';$('energy').textContent=Math.abs(q(time))>.7?'Elektr':'Magnit / aralash';\n$('fieldLines').setAttribute('opacity',String(.15+.8*Math.abs(q(time))));\n}\nfunction frame(now){if(!running){raf=0;return}if(last)time+=(now-last)/1000;last=now;draw();raf=requestAnimationFrame(frame)}\n$('play').onclick=()=>{running=!running;$('play').textContent=running?'⏸ Pauza':'▶ Davom ettirish';last=0;if(running&&!raf)raf=requestAnimationFrame(frame)};\n$('reset').onclick=()=>{time=0;last=0;draw();if(running&&!raf)raf=requestAnimationFrame(frame)};\n$('step').onclick=()=>{time+=p().T/4;draw()};\n['R','L','C'].forEach(id=>$(id).addEventListener('input',update));\n$('check').onclick=()=>{let score=0;document.querySelectorAll('.quiz').forEach((q,i)=>{let selected=q.querySelector('input:checked');if(selected&&selected.value===q.dataset.answer)score++});$('result').textContent='Natija: '+score+'/3 ta to‘g‘ri.'};\nupdate();raf=requestAnimationFrame(frame);if('ResizeObserver'in window)new ResizeObserver(draw).observe(canvas);\n})();\n\u003c/script>\n\u003c/body>\u003c/html>"}, {"t": "Induktiv gʻaltak", "h": "\u003c!DOCTYPE html>\n\u003chtml lang=\"uz\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>Induktiv g‘altak — o‘zgaruvchan tok simulyatori\u003c/title>\n\u003cstyle>\n:root{--bg:#f3f6f9;--sf:#fff;--tx:#14202b;--mu:#5b6b7a;--bd:#d5dde5;--i:#d1432b;--u:#1565c0;--p:#2e8b57;--ac:#0b5c8a}\n@media (prefers-color-scheme:dark){:root{--bg:#0e161d;--sf:#16212b;--tx:#e6edf3;--mu:#93a4b3;--bd:#2a3947;--i:#ff7a5c;--u:#5aa9ff;--p:#4fd08a;--ac:#5aa9ff}}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 Georgia,\"Times New Roman\",serif}\nh1,h2,h3,button,label,.num,nav{font-family:system-ui,-apple-system,\"Segoe UI\",sans-serif}\nheader{padding:22px 18px 8px;max-width:1000px;margin:auto}\nh1{margin:0;font-size:clamp(22px,4.5vw,34px);line-height:1.15}\nheader p{margin:6px 0 0;color:var(--mu)}\nnav{display:flex;gap:6px;flex-wrap:wrap;max-width:1000px;margin:12px auto;padding:0 18px}\nnav button{border:1px solid var(--bd);background:var(--sf);color:var(--tx);padding:9px 14px;border-radius:8px;font-size:14px;cursor:pointer}\nnav button[aria-selected=true]{background:var(--ac);color:#fff;border-color:var(--ac)}\nnav button:focus-visible,input:focus-visible,.opt:focus-visible{outline:3px solid var(--ac);outline-offset:2px}\nmain{max-width:1000px;margin:auto;padding:0 18px 40px}\nsection{display:none}section.on{display:block}\n.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:14px}\n.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}\n@media(max-width:760px){.grid{grid-template-columns:1fr}}\ncanvas{width:100%;display:block;border-radius:8px;background:var(--bg)}\n.ctl{display:grid;grid-template-columns:130px 1fr 90px;gap:8px;align-items:center;margin:8px 0;font-size:14px}\n.ctl output{text-align:right;font-weight:700}\ninput[type=range]{width:100%;accent-color:var(--ac)}\n.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:10px}\n.stat{border:1px solid var(--bd);border-radius:8px;padding:8px 10px}\n.stat small{display:block;color:var(--mu);font-family:system-ui;font-size:12px}\n.num{font-size:20px;font-weight:700}\n.i{color:var(--i)}.u{color:var(--u)}.p{color:var(--p)}\n.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}\n.btn{border:1px solid var(--ac);background:transparent;color:var(--ac);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:14px}\n.btn.on{background:var(--ac);color:#fff}\n.note{color:var(--mu);font-size:14px}\n.formula{font-family:\"Cambria Math\",Georgia,serif;font-size:18px;background:var(--bg);padding:8px 12px;border-radius:8px;margin:8px 0}\n.opt{display:block;width:100%;text-align:left;margin:5px 0;padding:9px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--sf);color:var(--tx);cursor:pointer;font:inherit;font-size:15px}\n.opt.ok{background:#1f8a4c;color:#fff;border-color:#1f8a4c}.opt.no{background:#c0392b;color:#fff;border-color:#c0392b}\n.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);width:0;transition:width .3s}\ntable{border-collapse:collapse;width:100%;font-size:14px}td,th{border:1px solid var(--bd);padding:6px 8px;text-align:left}\n@media (prefers-reduced-motion:reduce){*{transition:none!important}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cheader>\n\u003ch1>O‘zgaruvchan tok zanjiridagi induktiv g‘altak\u003c/h1>\n\u003cp>11-sinf fizika · interaktiv simulyator, tajriba, testlar va dars rejasi\u003c/p>\n\u003c/header>\n\u003cnav role=\"tablist\" id=\"tabs\">\n\u003cbutton role=\"tab\" data-t=\"sim\" aria-selected=\"true\">Simulyator\u003c/button>\n\u003cbutton role=\"tab\" data-t=\"lamp\" aria-selected=\"false\">Lampa tajribasi\u003c/button>\n\u003cbutton role=\"tab\" data-t=\"test\" aria-selected=\"false\">Test (10 ta)\u003c/button>\n\u003cbutton role=\"tab\" data-t=\"plan\" aria-selected=\"false\">Dars rejasi\u003c/button>\n\u003c/nav>\n\u003cmain>\n\n\u003csection id=\"sim\" class=\"on\">\n\u003cdiv class=\"card\">\n\u003cdiv class=\"ctl\">\u003cla
